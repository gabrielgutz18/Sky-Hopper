        rect(6, 5, w - 12, h - 22, flicker ? "#4a7cff" : "#1f4fd8");
        text(":(", 12, 10, "#ffffff", 16);
        for (let i = 0; i < 4; i++) rect(12, 32 + i * 4, 20 + ((i * 37 + (frame >> 4)) % 50), 2, "rgba(255,255,255,0.75)");
        bossEyes([w - 40, w - 24], 12, look, 7, "#ffffff", "#1f4fd8");
        rect(w - 10, h - 15, 3, 2, mod(frame >> 3, 2) ? "#7cf08a" : "#2a6a34");
    },
    // a wobbling stack of orange and grey frames, one pushed on top of another
    stack(w, h, b, look) {
        const slabs = 5;
        const sh = Math.floor(h / slabs);
        for (let i = 0; i < slabs; i++) {
            const sw = w - 8 - i * 6;
            const sway = Math.round(Math.sin(frame / 14 + i * 0.9) * (1 + i * 0.8));
            const x = (w - sw) / 2 + sway;
            const y = h - (i + 1) * sh;
            rect(x - 1, y, sw + 2, sh, INK);
            rect(x, y + 1, sw, sh - 2, i % 2 ? "#bcbbbb" : "#f48024");
            rect(x, y + 1, sw, 1, i % 2 ? "#e4e4e4" : "#ffb070");
            if (i < slabs - 1) text(`0x${(i * 4 + 0x7f0).toString(16)}`, x + 4, y + 2, i % 2 ? "#5a5a5a" : "#7a3200");
        }
        const topY = h - slabs * sh;
        bossEyes([w / 2 - 14, w / 2 + 4], topY + 2, look, 6);
    },
    // a red beetle with a clock on its back stuck between 99 and 00
    y2k(w, h, b, look) {
        const legY = h - 8;
        for (let i = 0; i < 4; i++) {
            const lx = 14 + i * 20;
            const lift = mod((frame >> 3) + i, 2) * 2;
            rect(lx, legY - lift, 4, 8 + lift, INK);
        }
        rect(4, 10, w - 18, h - 18, INK);
        rect(5, 11, w - 20, h - 20, "#d8343c");
        rect(5, 11, w - 20, 3, "#ff6a6a");
        rect(w / 2 - 6, 11, 2, h - 20, "#8a1a20");
        rect(14, 18, 34, 16, INK);
        rect(15, 19, 32, 14, "#1a2a1a");
        text(mod(frame >> 5, 2) ? "00" : "99", 16, 21, "#7cff8a", 16);
        rect(w - 18, 18, 16, 22, INK);
        rect(w - 17, 19, 14, 20, "#a8242c");
        bossEyes([w - 14], 22, 1, 6, "#ffe0a0", INK);
        rect(w - 8, 4, 2, 14, INK);
        rect(w - 4, 2, 2, 14, INK);
    },
    // a black screen that has given up: red text, and sparks coming off it
    panic(w, h, b, look) {
        const hot = b.windup > 0 || mod(frame >> 3, 2);
        rect(4, 0, w - 8, h - 4, hot ? "#ff3a3a" : "#8a1a1a");
        rect(6, 2, w - 12, h - 8, "#0a0a0a");
        text("KERNEL", 14, 8, "#ff4a4a");
        text("PANIC", 18, 20, hot ? "#ffffff" : "#ff4a4a");
        rect(14, 32, 20, 2, "#ff4a4a");
        for (let i = 0; i < 3; i++) rect(14, 36 + i * 4, 40 + ((i * 29 + (frame >> 3)) % 20), 2, "rgba(255,80,80,0.6)");
        bossEyes([w - 32, w - 18], 34, look, 6, "#ff4a4a", "#ffffff");
        for (let i = 0; i < 4; i++) {
            if (hash(i * 31 + (frame >> 2)) < 0.5) continue;
            rect(hash(i * 13 + (frame >> 2)) * w, hash(i * 17 + (frame >> 2)) * h, 2, 2, "#ffd84a");
        }
    },
    // an ancient mainframe in grey stone, its tape reels still turning
    monolith(w, h, b, look) {
        rect(0, 0, w, h, INK);
        rect(1, 1, w - 2, h - 2, "#5a5a66");
        rect(1, 1, w - 2, 2, "#8a8a96");
        rect(1, h - 4, w - 2, 3, "#3a3a44");
        for (const cx of [20, w - 20]) {
            rect(cx - 10, 8, 20, 20, INK);
            rect(cx - 9, 9, 18, 18, "#2a2a32");
            rect(cx - 3, 15, 6, 6, "#8a8a96");
            const turn = (frame / 10 + cx) % (Math.PI * 2);
            for (let k = 0; k < 3; k++) {
                const a = turn + (k * Math.PI * 2) / 3;
                rect(cx + Math.cos(a) * 6 - 1, 18 + Math.sin(a) * 6 - 1, 3, 3, "#c8c8d2");
            }
        }
        for (let i = 0; i < 10; i++) rect(10 + i * 8, 34, 4, 3, hash(i * 7 + (frame >> 4)) < 0.5 ? "#ffd84a" : "#4a4a20");
        text("COBOL", w / 2 - 20, 42, "#3a3a44");
        // the cracks spread as it weakens
        const cracks = Math.floor((1 - b.hp / b.maxHp) * 4);
        for (let i = 0; i < cracks; i++) for (let k = 0; k < 6; k++) rect(12 + i * 22 + (k % 2) * 2, 4 + k * 3, 1, 3, INK);
        bossEyes([w / 2 - 12, w / 2 + 4], 12, look, 6, "#ffd84a", INK);
    },
};

function drawBoss(f, bx, by) {
    const b = f.boss;
    const w = b.w * CW;
    const h = b.h * CH;
    const look = drawnCx + 2.5 > b.x + b.w / 2 ? 1 : -1;
    onBossCanvas(() => {
        if (b.big) {
            ctx.save();
            ctx.translate(BOSS_PAD, BOSS_PAD);
            BIG_ART[b.kind](w, h, b, look);
            ctx.restore();
            return;
        }
        const art = b.kind === "bug" ? BOSS_BUG : CREATURE_ART[b.kind];
        const frameNo = mod((frame >> 3) + (b.act === "idle" ? 0 : frame >> 2), 2);
        drawArtBig(art.frames[frameNo], art.colors, BOSS_PAD, BOSS_PAD, b.dir < 0, 6);
    });
    const bctx = bossCanvas.getContext("2d");
    // hit: its shape flashes white; beaten: it blinks out
    if (b.flash > 0 || (b.dying && mod(frame >> 2, 2))) {
        bctx.globalCompositeOperation = "source-atop";
        bctx.fillStyle = "rgba(255,255,255,0.8)";
        bctx.fillRect(0, 0, bossCanvas.width, bossCanvas.height);
        bctx.globalCompositeOperation = "source-over";
    }
    // winding up: it shakes, and a red ! shows over it
    const shakeX = b.windup > 0 ? (mod(frame >> 1, 2) ? 1 : -1) : 0;
    const x = px(bx) + shakeX;
    const top = py(by + b.h);
    if (b.dying) ctx.globalAlpha = Math.max(0.2, b.dying / 36);
    // a dropper hangs on a thread
    if (b.style === "drop") rect(x + w / 2, HUD, 2, Math.max(0, top - HUD), "rgba(220,225,240,0.6)");
    ctx.drawImage(bossCanvas, x - BOSS_PAD, top - BOSS_PAD);
    ctx.globalAlpha = 1;
    if (b.windup > 0 && blinkOn()) outlinedAt("!", x + w / 2 - 4, top - 14, "#ff4a4a");
    // where a charge, a leap, a dive or a drop is about to land
    if (b.windup > 0 && b.target) {
        const tx = px(b.target.x);
        const feet = py(f.floor + 1);
        const mark = mod(frame >> 3, 2) ? "#ff4a4a" : "#ffe0a0";
        if (b.act === "charge") {
            for (let k = 0; k < 4; k++) arrowAt(x + w / 2 + b.dir * (w / 2 + 6 + k * 14), feet - 10, b.dir, mark);
        } else {
            rect(tx, feet - 2, w, 2, mark);
            rect(tx, feet - 6, 2, 4, mark);
            rect(tx + w - 2, feet - 6, 2, 4, mark);
        }
    }
}

const outlinedAt = (s, x, y, color, size = 8) => {
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) text(s, x + dx, y + dy, INK, size);
    text(s, x, y, color, size);
};
function arrowAt(x, y, dir, color) {
    for (let k = 0; k < 4; k++) rect(x + (dir > 0 ? k * 2 : -k * 2), y + k, 2, 8 - k * 2, color);
}

// the walls that close the arena: glowing bars at both ends
function drawWalls(f) {
    const top = py(f.floor + 18);
    const bottom = py(f.floor);
    const glow = 0.5 + 0.3 * Math.sin(frame / 10);
    for (const x of [px(f.x0) - 2, px(f.x1) - 2]) {
        rect(x, top, 4, bottom - top, `rgba(255,90,60,${glow})`);
        rect(x + 1, top, 2, bottom - top, "#ffd0b0");
        for (let y = top + mod(frame, 16); y < bottom; y += 16) rect(x - 1, y, 6, 2, "#ff5a3a");
    }
}

// an attack: while it's warning, only a mark where it will be; then the thing itself
function drawAttack(a, f) {
    const x = px(a.x);
    const w = a.w * CW;
    const feet = py(f.floor + 1);
    const blink = mod(frame >> 3, 2);
    const mark = blink ? "#ff4a4a" : "#ffe0a0";
    if (a.warn > 0) {
        if (a.kind === "fall" || a.kind === "bomb") {
            rect(x, HUD, w, feet - HUD, `rgba(255,80,40,${blink ? 0.12 : 0.06})`);
            rect(x - 2, feet - 2, w + 4, 2, mark);
            rect(x - 2, feet - 6, 2, 4, mark);
            rect(x + w, feet - 6, 2, 4, mark);
        } else if (a.kind === "bolt") {
            rect(x, py(a.y + a.h), w, a.h * CH, `rgba(255,60,60,${blink ? 0.28 : 0.14})`);
        } else if (a.kind === "row" || a.kind === "slide") {
            // a flashing sign at the wall it will come through, at its height
            const fromLeft = a.vx > 0;
            const ex = fromLeft ? px(f.x0) + 4 : px(f.x1) - 14;
            if (a.warn < 40 || blink) outlinedAt("!", ex, py(a.y + a.h) + 2, mark);
            arrowAt(fromLeft ? ex + 12 : ex - 6, py(a.y) - 9, fromLeft ? 1 : -1, mark);
        }
        if (a.kind === "bomb") {
            // the bomb on its way over, landing as its fuse runs out
            const k = 1 - a.warn / a.fuse;
            const bx = a.fromX + (a.x + a.w / 2 - a.fromX) * k;
            const by = a.fromY + (a.y - a.fromY) * k + 10 * Math.sin(Math.PI * k);
            rect(px(bx) - 5, py(by) - 10, 10, 10, INK);
            rect(px(bx) - 4, py(by) - 9, 8, 8, "#3a3a44");
            rect(px(bx) + 1, py(by) - 13, 2, 4, blink ? "#ffd84a" : "#ff6a1a");
        }
        return;
    }
    const top = py(a.y + a.h);
    const h = a.h * CH;
    if (a.kind === "fall" && !a.block) {
        rect(x + 2, top - 6, w - 4, 6, "rgba(255,120,80,0.35)");
        rect(x + 3, top, w - 6, h, INK);
        rect(x + 4, top + 1, w - 8, h - 2, "#ff5a3a");
        rect(x + 5, top + 2, 3, 3, "#ffd0a0");
    } else if (a.kind === "fall" || a.kind === "slide") {
        rect(x, top, w, h, INK);
        rect(x + 1, top + 1, w - 2, h / 2 - 1, "#f48024");
        rect(x + 1, top + h / 2, w - 2, h / 2 - 1, "#bcbbbb");
        rect(x + 1, top + 1, w - 2, 1, "#ffb070");
        if (a.kind === "slide") arrowAt(a.vx > 0 ? x + w - 8 : x + 6, top + h / 2 - 4, Math.sign(a.vx), INK);
    } else if (a.kind === "row") {
        rect(x, top, w, h, INK);
        rect(x + 1, top + 1, w - 2, h - 2, "#c8202a");
        text("ERROR", x + 1, top + 2, blink ? "#ffffff" : "#ffd0d0");
    } else if (a.kind === "wave") {
        for (let k = 0; k < 3; k++) rect(x + k * 4, top + 8 - k * 4, w - k * 8 + 4, 4 + k * 4, `rgba(255,${230 - k * 40},120,${0.9 - k * 0.25})`);
    } else if (a.kind === "bolt") {
        for (let y = top; y < top + h; y += 8) {
            const zig = (Math.floor((y - top) / 8) + (frame >> 1)) % 2 ? 4 : -4;
            rect(x + w / 2 - 3 + zig, y, 6, 8, "#fff6c0");
            rect(x + w / 2 - 1 + zig, y, 2, 8, "#ffffff");
        }
        rect(x - 4, feet - 4, w + 8, 4, "rgba(255,240,160,0.8)");
    } else if (a.kind === "bomb") {
        const r = a.w * CW * 0.5;
        const cx = x + w / 2;
        rect(cx - r, top, r * 2, h, `rgba(255,140,40,${0.4 + 0.2 * blink})`);
        rect(cx - r * 0.6, top + h * 0.3, r * 1.2, h * 0.7, "#ffb347");
        rect(cx - r * 0.25, top + h * 0.5, r * 0.5, h * 0.5, "#fff0a0");
    }
}

// a mini fireball: a hot core, and a tail behind it
function drawShot(s, sx) {
    const x = px(sx);
    const y = py(s.y) - 3;
    for (let k = 1; k <= 3; k++) rect(x - s.dir * k * 4 - 1, y + 1, 4 - k + 1, 4 - k + 1, `rgba(255,${180 - k * 30},40,${0.7 - k * 0.18})`);
    rect(x - 3, y - 1, 7, 7, INK);
    rect(x - 2, y, 5, 5, "#ff7a1a");
    rect(x - 1, y + 1, 3, 3, "#ffe08a");
}

function drawHeart(x, y, full) {
    const rows = [".kk.kk.", "kffkffk", "kfffffk", ".kfffk.", "..kfk..", "...k..."];
    rows.forEach((row, r) =>
        [...row].forEach((ch, c) => {
            if (ch !== ".") rect(x + c * 2, y + r * 2, 2, 2, ch === "k" ? INK : full ? "#ff4a5a" : "#3a2a34");
        }),
    );
}

// the boss's name and health along the top of the arena
function drawBossBar(f) {
    const b = f.boss;
    const barW = 200;
    const x = (VW - barW) / 2;
    const y = HUD + 6;
    centered(`${b.big ? "" : "MINI "}BOSS: ${b.name.toUpperCase()}`, y, b.big ? "#ff8a8a" : "#ffd84a");
    rect(x - 1, y + 11, barW + 2, 6, INK);
    rect(x, y + 12, barW, 4, "#2a1a24");
    rect(x, y + 12, Math.max(0, (barW * b.hp) / b.maxHp), 4, b.hp / b.maxHp > 0.33 ? "#ff4a5a" : "#ffd84a");
}

// ---- the score bar and the screens over the world ----

function drawHud() {
    const theme = themeNow();
    const best = g.assisted ? record : Math.max(record, scoreOf(g));
    rect(0, 0, VW, HUD, INK);
    rect(0, HUD - 2, VW, 2, theme.look.plate);
    const lap = lapOf(g.stage - 1);
    let left = 4;
    if (g.fight) {
        for (let i = 0; i < 3; i++) drawHeart(4 + i * 16, 2, i < g.fight.hearts);
        left = 54;
    } else {
        text(theme.name.toUpperCase(), 4, 4, theme.look.light);
        ctx.font = `8px ${FONT}`;
        left = 12 + ctx.measureText(theme.name.toUpperCase()).width;
    }
    if (lap > 1) text(`L${lap}`, left, 4, "#ffd84a");
    const right = `DIST ${g.best}  SCORE ${scoreOf(g)}  HI ${best}`;
    ctx.font = `8px ${FONT}`;
    text(right, VW - 4 - ctx.measureText(right).width, 4, "#f4f4f8");
}

const dim = () => rect(0, HUD, VW, VH - HUD, "rgba(7,7,13,0.72)");
const blinkOn = () => mod(frame >> 4, 2) === 0;

function drawTitle() {
    dim();
    centered("SKY HOP", HUD + 14, "#ffffff", 24);
    centered("17 WORLDS OF TECH", HUD + 42, CLAUDE.body);
    ctx.save();
    ctx.translate(VW / 2 - 40, HUD + 76);
    ctx.scale(2, 2);
    drawClaude(0, 24, { bob: mod(frame >> 5, 2), eyes: mod(frame, 200) < 8 ? "blink" : "open" });
    ctx.restore();
    const lines = ["ARROWS / A D   MOVE", "SPACE  JUMP / LET GO", "W FLAP   S DROP / DOOR", "F  FIRE AT A BOSS", "C STYLE  TAB CLOCK  M SOUND"];
    lines.forEach((line, i) => centered(line, HUD + 132 + i * 13, "#c9c9de"));
    if (blinkOn()) centered("PRESS SPACE", HUD + 206, "#ffd84a");
    centered(`PLAYING AS ${lookParts(g.look).character.name.toUpperCase()}`, HUD + 224, CLAUDE.light);
}

// the wardrobe: the character big on the left, a row for each thing to wear on the right, and the whole line-up below
function drawWardrobe() {
    dim();
    const parts = lookParts(g.look);
    centered("WARDROBE", HUD + 8, "#ffffff", 16);
    ctx.save();
    ctx.translate(36, HUD + 50);
    ctx.scale(3, 3);
    drawClaude(0, 34, { stride: mod(frame >> 4, 2), eyes: mod(frame, 200) < 8 ? "blink" : "open", dir: 1, moving: true });
    ctx.restore();
    const name = parts.character.name.toUpperCase();
    ctx.font = `8px ${FONT}`;
    text(name, 96 - ctx.measureText(name).width / 2, HUD + 160, "#ffd84a");
    SLOTS.forEach((slot, i) => {
        const y = HUD + 46 + i * 28;
        const on = g.wardrobe.row === i;
        text(slot.name.toUpperCase(), 176, y, on ? "#ffd84a" : "#8a8aa8");
        text(`< ${parts[slot.key].name.toUpperCase()} >`, 176, y + 11, on ? "#ffffff" : "#c9c9de");
        if (on && blinkOn()) text(">", 164, y + 11, "#ffd84a");
    });
    CHARACTERS.forEach((who, i) => {
        const chosen = who.id === parts.character.id;
        drawClaude(i * 32 - 4, HUD + 196 - (chosen ? 2 + mod(frame >> 4, 2) : 0), { eyes: chosen ? "happy" : "open" }, { character: who.id, hat: "none", eyewear: "none", clothes: "none" });
    });
    // on a phone the pad's buttons do it: FLAP and DOWN pick a row, the arrows change it, JUMP is done
    const touch = matchMedia("(pointer: coarse)").matches;
    centered(touch ? "FLAP DOWN PICK   < > CHANGE" : "W S PICK   A D CHANGE   X RANDOM", HUD + 212, "#c9c9de");
    if (blinkOn()) centered(touch ? "JUMP  DONE" : "SPACE  DONE", HUD + 226, "#ffd84a");
}

function drawOver() {
    if (clock - deathAt < 0.7) return;
    dim();
    centered("GAME OVER", HUD + 60, "#ff4a52", 16);
    centered(g.cause.toUpperCase(), HUD + 96, "#f4f4f8");
    centered(`SCORE ${scoreOf(g)}`, HUD + 120, "#ffd84a");
    if (!g.assisted && scoreOf(g) > 0 && scoreOf(g) >= record) centered("NEW BEST!", HUD + 136, CLAUDE.body);
    if (!g.auto && blinkOn()) centered("PRESS R TO TRY AGAIN", HUD + 172, "#c9c9de");
}

// what a dangerous disaster means, under its name
const WARNINGS = {
    "meteor shower": "KEEP OFF THE RED MARKS",
    volcano: "LAVA LANDS ON THE MARKS, AND BURNS",
    wildfire: "SMOKING PLATFORMS ARE ABOUT TO BURN",
};

function drawBanner() {
    if (g.phase !== "playing") return;
    const theme = themeNow();
    const f = g.fight;
    if (f) {
        if (f.intro > 0) {
            rect(0, HUD + 60, VW, 50, "rgba(7,7,13,0.6)");
            outlined(f.boss.big ? "BOSS!" : "MINI BOSS!", HUD + 66, blinkOn() ? "#ff4a5a" : "#ffffff", 16);
            outlined(f.boss.name.toUpperCase(), HUD + 88, "#ffd84a");
            if (f.lap > 1) outlined(`LAP ${f.lap}: TOUGHER`, HUD + 100, "#c9c9de");
        } else if (f.intro === 0 && f.boss.hp === f.boss.maxHp && blinkOn()) {
            outlined("PRESS F TO FIRE", HUD + 200, "#ffffff");
        }
        drawBossBar(f);
        return;
    }
    if (g.beaten) outlined(`${g.beaten.name.toUpperCase()} BEATEN! +${g.beaten.bonus}`, HUD + 80, blinkOn() ? "#ffd84a" : "#ffffff");
    if (g.banner > 0) {
        rect(0, HUD + 28, VW, 40, "rgba(7,7,13,0.6)");
        if (g.tunnel !== null) {
            centered(`${theme.name.toUpperCase()} TUNNEL!`, HUD + 34, blinkOn() ? theme.look.light : "#ffffff", 16);
            centered("GRAB THE STARS, FIND THE EXIT", HUD + 56, "#c9c9de");
        } else {
            const lap = lapOf(g.stage - 1);
            // back at the first world: the next lap, and everything's tougher
            const newLap = lap > 1 && (g.stage - 1) % 17 === 0;
            centered(newLap ? `LAP ${lap}!` : `${theme.name.toUpperCase()} ZONE!`, HUD + 34, blinkOn() ? theme.look.light : "#ffffff", 16);
            centered(newLap ? "THE BOSSES ARE TOUGHER" : `STAGE ${g.stage}: HARDER NOW`, HUD + 56, "#c9c9de");
        }
        return;
    }
    if (g.tunnel !== null) return;
    // a disaster gets its name up for a few seconds as it starts, and what it means for Claude when it's dangerous
    if (sky.disaster && sky.age < 110) {
        outlined(`${sky.disaster.toUpperCase()}!`, HUD + 36, blinkOn() ? "#ff8a3a" : "#ffe0a0", 16);
        const warning = g.hazards && WARNINGS[sky.disaster];
        if (warning) outlined(warning, HUD + 60, "#ffffff");
        return;
    }
    if (g.hazards && sky.weather === "sandstorm" && sky.amount > 0.5 && sky.amount < 0.9) outlined(`SANDSTORM! WIND ${sky.wind > 0 ? ">>>" : "<<<"}`, HUD + 36, "#ffe0a0");
}

// Tab puts up the computer's own time over the game, and the autopilot keeps playing underneath it like a screensaver
const DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
function drawClock() {
    const now = new Date();
    const hours = String(now.getHours() % 12 || 12);
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const ampm = now.getHours() < 12 ? "AM" : "PM";
    const theme = themeNow();

    rect(0, 0, VW, VH, "rgba(7,7,13,0.3)");

    // the hours, a colon that blinks each second, the minutes, and AM or PM tucked beside them
    const big = 40;
    const y = 72;
    ctx.font = `${big}px ${FONT}`;
    const parts = [hours, ":", minutes].map((s) => ({ s, w: ctx.measureText(s).width }));
    ctx.font = `8px ${FONT}`;
    const ampmW = ctx.measureText(ampm).width;
    const total = parts.reduce((sum, p) => sum + p.w, 0) + 6 + ampmW;
    let x = (VW - total) / 2;
    const colonOn = now.getSeconds() % 2 === 0;
    for (const p of parts) {
        const color = p.s === ":" && !colonOn ? "#3a3a55" : "#ffffff";
        text(p.s, x + 3, y + 3, INK, big);
        text(p.s, x, y, color, big);
        x += p.w;
    }
    text(ampm, x + 6, y, theme.look.light);

    const date = `${DAYS[now.getDay()]}  ${MONTHS[now.getMonth()]} ${now.getDate()}  ${now.getFullYear()}`;
    ctx.font = `8px ${FONT}`;
    const dateX = (VW - ctx.measureText(date).width) / 2;
    text(date, dateX + 1, y + 61, INK);
    text(date, dateX, y + 60, "#ffffff");

    // the minute filling up, one pixel column per second
    const barW = 120;
    const barX = (VW - barW) / 2;
    rect(barX, y + 80, barW, 4, "#1d1d30");
    rect(barX, y + 80, (barW * (now.getSeconds() + now.getMilliseconds() / 1000)) / 60, 4, theme.look.light);
}

// ---- one frame ----

let drawnCx = 0;
let drawnCy = 0;
function draw(alpha) {
    clock = performance.now() / 1000;
    frame = Math.floor(clock * 60);
    const t = weatherTicks + alpha;
    // between ticks, everything slides from where it was to where it is; after a restart or a trip through a tunnel
    // there's nothing to slide from
    const live = prev && prev.claude === g.claude && g.ticks === prev.ticks + 1 && prev.tunnel === g.tunnel && g.warp < WARP_TICKS - 1;
    const a = live ? alpha : 1;
    const lerp = (from, to) => from + (to - from) * a;
    cam = live ? lerp(prev.cam, g.camera) : g.camera;
    camX = live ? lerp(prev.camX, g.camX) : g.camX;
    const xOf = (o) => {
        const was = live ? prev.xs.get(o) : undefined;
        return was === undefined || Math.abs(o.x - was) > 4 ? o.x : lerp(was, o.x);
    };
    drawnCx = live ? lerp(prev.cx, g.claude.x) : g.claude.x;
    drawnCy = live ? lerp(prev.cy, g.claude.y) : g.claude.y;
    const tunnel = tunnelNow();
    const theme = themeNow();
    const outside = !tunnel;

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, HUD, VW, VH - HUD);
    ctx.clip();
    if (shake > 0.3) ctx.translate(Math.round((Math.random() - 0.5) * shake), Math.round((Math.random() - 0.5) * shake));
    shake *= 0.88;
    // an earthquake rocks everything
    if (outside && sky.disaster === "earthquake" && sky.power > 0.1) {
        ctx.translate(Math.round(Math.sin(t * 2.3) * 2.5 * sky.power), Math.round(Math.cos(t * 3.1) * 1.5 * sky.power));
    }

    ctx.drawImage(skyFor(theme), 0, HUD);
    if (outside) {
        drawFar();
        drawWeatherBack(t);
        drawSkyline(theme, g.stage - 1);
        drawDisasterLow(t);
    } else {
        drawTunnelBack(tunnel, theme);
    }
    drawWords(theme);
    for (const b of g.bolts) if (b.t > BOLT_STRIKE) drawBolt(b);
    for (const d of g.doors) drawDoor(d);
    if (tunnel) drawExit(tunnel);
    for (const p of g.plates) drawPlate(p, xOf(p));
    for (const p of g.plates) if (p.fire) drawFire(p, xOf(p));
    for (const r of g.ropes) drawRope(r);
    for (const s of g.stars) drawStar(s);
    for (const c of g.creatures) {
        const was = live ? prev.ys.get(c) : undefined;
        drawCreature(c, xOf(c), was === undefined || Math.abs(c.y - was) > 4 ? c.y : lerp(was, c.y));
    }
    for (const s of g.strikes) drawStrike(s);
    for (const i of g.impacts) drawImpact(i);
    const fight = g.fight;
    if (fight) {
        drawWalls(fight);
        for (const at of fight.attacks) if (at.warn > 0) drawAttack(at, fight);
        const b = fight.boss;
        const wasY = live ? prev.ys.get(b) : undefined;
        drawBoss(fight, xOf(b), wasY === undefined || Math.abs(b.y - wasY) > 4 ? b.y : lerp(wasY, b.y));
        for (const at of fight.attacks) if (at.warn === 0) drawAttack(at, fight);
    }

    if (g.phase === "over") {
        // knocked out: Claude pops up and drops off the bottom of the screen
        const since = clock - deathAt;
        drawClaude(px(deathX), py(deathY) - 90 * since + 320 * since * since, { eyes: "dead", legs: 6 });
    } else if (!g.wardrobe && !(fight && fight.hurt > 0 && mod(frame >> 2, 2))) {
        // just hit: Claude flashes while it can't be hit again
        drawClaude(px(drawnCx), py(drawnCy), claudePose());
    }
    if (fight) for (const s of fight.shots) drawShot(s, xOf(s));

    for (const b of g.bolts) if (b.t <= BOLT_STRIKE) drawBolt(b);
    for (const p of particles) {
        ctx.globalAlpha = Math.min(1, p.life / 8);
        rect(px(p.x), py(p.y) - 2, 2, 2, p.color);
    }
    ctx.globalAlpha = 1;
    if (outside) drawWeatherFront(t);
    if (tunnel) {
        // an old screen's scan lines over everything down here
        for (let y = HUD; y < VH; y += 3) rect(0, y, VW, 1, "rgba(0,0,0,0.22)");
    }
    if (outside && thunderNow(t)) rect(0, HUD, VW, VH - HUD, `rgba(235,240,255,${0.3 * (1 - mod(t, THUNDER_EVERY) / 4)})`);
    if (flash > 0.02) rect(0, HUD, VW, VH - HUD, `rgba(255,255,240,${flash})`);
    flash *= 0.85;
    // going down a tunnel or coming back up: a quick fade through black
    if (g.warp > 0) rect(0, HUD, VW, VH - HUD, `rgba(0,0,0,${Math.min(1, (g.warp - alpha) / (WARP_TICKS / 2))})`);
    ctx.restore();

    drawHud();
    if (g.auto) {
        drawClock();
        return;
    }
    drawBanner();
    if (g.phase === "title") {
        if (g.wardrobe) drawWardrobe();
        else drawTitle();
    }
    if (g.phase === "over") drawOver();
}

// ?debug hands the game to the browser console, for looking at things
if (params.has("debug")) window.skyHop = g;

requestAnimationFrame(loop);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Hop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #07070d; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden; touch-action: none; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    .pad { display: none; gap: 6px; }
    @media (pointer: coarse) { .pad { display: flex; } }
    .pad button {
        font: 10px "Press Start 2P", monospace; color: #f4f4f8; background: #1d1d30;
        border: 2px solid #44446a; border-radius: 6px; min-width: 42px; min-height: 56px;
        touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .pad button:active { background: #36365a; }
</style>
</head>
<body>
<canvas id="screen" aria-label="Sky Hop. Arrow keys or A and D to move, Space to jump and to let go of a rope, S to go down a tunnel door, F to throw fireballs at a boss, C on the title screen to pick a character and clothes."></canvas>
<div class="pad">
    <button data-key="a" aria-label="Move left">&lt;</button>
    <button data-key=" ">JUMP</button>
    <button data-key="w">FLAP</button>
    <button data-key="s" aria-label="Drop, or go into a door">DOWN</button>
    <button data-key="f" aria-label="Throw a fireball at the boss">FIRE</button>
    <button data-key="c" aria-label="Pick a character and clothes">STYLE</button>
    <button data-key="d" aria-label="Move right">&gt;</button>
</div>
<script type="module">
// the 16-bit Sky Hop: the same rules as the terminal game (game.mjs), drawn as pixel art
// run it with: node serve.mjs, then open http://localhost:8765
import { autopilot } from "./autopilot.mjs";
import { BOLT_STRIKE, CRUMBLE_TICKS, H, HANDS, TICK_MS, W, WARP_TICKS, doorAt, input, lapOf, newGame, scoreOf, sectionOf, step } from "./game.mjs";
import { STRIKE_WARNING, updateSky } from "./hazards.mjs";
import { CHARACTERS, SLOTS, lookFromText, lookParts, lookToText } from "./looks.mjs";
import { codeLine, eraOf, placeOf, themeOf, wordFor } from "./places.mjs";
import { DISASTERS, WEATHERS } from "./weather.mjs";

// one cell of the game's grid is 8 x 12 pixels, so the window is 352 x 240 under a 16 pixel score bar
const CW = 8;
const CH = 12;
const HUD = 16;
const VW = W * CW;
const VH = HUD + H * CH;
const FONT = '"Press Start 2P", monospace';
const INK = "#0b0b14";
const CLAUDE = { body: "#d97757", light: "#eda183", shade: "#b0573a", ink: "#2b1209", eye: "#141414" };

const canvas = document.getElementById("screen");
// let, not const: a boss is drawn onto a canvas of its own first (see drawBoss)
let ctx = canvas.getContext("2d");
canvas.width = VW;
canvas.height = VH;

const mod = (n, m) => ((n % m) + m) % m;
const rect = (x, y, w, h, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
};
const text = (s, x, y, color, size = 8) => {
    ctx.font = `${size}px ${FONT}`;
    ctx.fillStyle = color;
    ctx.textBaseline = "top";
    ctx.fillText(s, Math.round(x), Math.round(y));
};
const centered = (s, y, color, size = 8) => {
    ctx.font = `${size}px ${FONT}`;
    text(s, (VW - ctx.measureText(s).width) / 2, y, color, size);
};
// a word with a dark outline, for anything drawn over a busy picture
const outlined = (s, y, color, size = 8) => {
    ctx.font = `${size}px ${FONT}`;
    const x = (VW - ctx.measureText(s).width) / 2;
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [2, 2]]) text(s, x + dx, y + dy, INK, size);
    text(s, x, y, color, size);
};
const hash = (n) => {
    let t = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b);
    t ^= t >>> 13;
    t = Math.imul(t, 0xc2b2ae35);
    t ^= t >>> 16;
    return (t >>> 0) / 4294967296;
};

// ---- the game, the keys and the best score ----

const BEST_KEY = "sky-hop-best";
let record = 0;
try {
    record = Number(localStorage.getItem(BEST_KEY)) || 0;
} catch {
    // no saved best in this browser; the game itself is fine
}
const params = new URLSearchParams(location.search);
// ?world=5 starts in the fifth world, for a look at it and its boss
const g = newGame(undefined, { world: Math.max(0, Math.floor(Number(params.get("world")) || 1) - 1) });

// who's playing and what they wear, kept in this browser
const LOOK_KEY = "sky-hop-look";
try {
    g.look = lookFromText(localStorage.getItem(LOOK_KEY));
} catch {
    // nothing saved, or no storage here: plain Claude
}
const saveLook = () => {
    try {
        localStorage.setItem(LOOK_KEY, lookToText(g.look));
    } catch {
        // not saved, but kept for this visit
    }
};

const saveBest = () => {
    if (g.assisted || scoreOf(g) <= record) return;
    record = scoreOf(g);
    try {
        localStorage.setItem(BEST_KEY, String(record));
    } catch {
        // not saved, but still shown for this visit
    }
};

// a browser says when a key is let go, so walking stops the moment it is, unlike in a terminal
const held = [];
const press = (key) => {
    wakeAudio();
    // the wardrobe takes one step per press, never a held key
    if (g.wardrobe || (key === "c" && g.phase === "title")) {
        input(g, key);
        if (!g.wardrobe) saveLook();
        return;
    }
    if (key === "a" || key === "d") {
        if (!held.includes(key)) held.push(key);
        input(g, key);
        return;
    }
    if (key === "r") saveBest();
    if (key === "m") {
        muted = !muted;
        return;
    }
    input(g, key);
};
const release = (key) => {
    const at = held.indexOf(key);
    if (at < 0) return;
    held.splice(at, 1);
    if (held.length === 0 && !g.auto) g.claude.left = 0;
};

const KEYS = {
    ArrowLeft: "a", KeyA: "a", ArrowRight: "d", KeyD: "d",
    Space: " ", ArrowUp: "w", KeyW: "w", ArrowDown: "s", KeyS: "s",
    Enter: "\r", Tab: "\t", KeyR: "r", KeyM: "m", KeyF: "f", KeyE: "e", KeyC: "c", KeyX: "x", Escape: "\x1b",
};
addEventListener("keydown", (e) => {
    const key = KEYS[e.code];
    if (!key) return;
    e.preventDefault();
    // a held Tab repeats by itself, and must count as one press rather than flicking the autopilot on and off
    if (e.repeat && key !== "a" && key !== "d") return;
    press(key);
});
addEventListener("keyup", (e) => {
    const key = KEYS[e.code];
    if (key) release(key);
});
canvas.addEventListener("pointerdown", () => press(" "));
for (const button of document.querySelectorAll(".pad button")) {
    const key = button.dataset.key;
    button.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        press(key);
    });
    for (const type of ["pointerup", "pointerleave", "pointercancel"]) button.addEventListener(type, () => release(key));
}

function fit() {
    const pad = matchMedia("(pointer: coarse)").matches ? 90 : 0;
    const room = Math.min(innerWidth / VW, (innerHeight - pad - 24) / VH);
    // whole-number scaling keeps every pixel square; a phone too narrow for that gets the nearest fit
    const scale = room >= 1 ? Math.floor(room) : room;
    canvas.style.width = `${Math.floor(VW * scale)}px`;
    canvas.style.height = `${Math.floor(VH * scale)}px`;
}
addEventListener("resize", fit);
fit();

// ---- chiptune blips ----

let audio = null;
let muted = false;
function wakeAudio() {
    try {
        audio ??= new AudioContext();
        if (audio.state === "suspended") audio.resume();
    } catch {
        audio = null;
    }
}
function tone(freqs, dur = 0.06, type = "square", vol = 0.05) {
    if (!audio || muted) return;
    const start = audio.currentTime;
    freqs.forEach((freq, i) => {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        const t = start + i * dur;
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.95);
        osc.connect(gain).connect(audio.destination);
        osc.start(t);
        osc.stop(t + dur);
    });
}
function noise(dur = 0.35, vol = 0.12) {
    if (!audio || muted) return;
    const buffer = audio.createBuffer(1, Math.floor(audio.sampleRate * dur), audio.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const source = audio.createBufferSource();
    const gain = audio.createGain();
    gain.gain.value = vol;
    source.buffer = buffer;
    source.connect(gain).connect(audio.destination);
    source.start();
}

// ---- the weather: the game's own (see hazards.mjs), since some of it is part of the rules; here it's drawn and heard ----

// the weather's pictures move on their own clock, so the rain still falls on the title screen and after a game over
let weatherTicks = 0;
// ?sky=rain (or snow, volcano, meteor-shower...) holds one weather or disaster on for a look at it
const heldSky = (params.get("sky") ?? "").replace(/-/g, " ").toLowerCase();
if (WEATHERS.includes(heldSky) || DISASTERS.includes(heldSky)) {
    g.holdSky = heldSky;
    updateSky(g);
}
let sky = g.sky;
// a thunderstorm's lightning comes in windows of this many ticks, and lights up the start of some of them
const THUNDER_EVERY = 36;
const thunderIn = (t) => sky.weather === "thunderstorm" && sky.amount > 0.4 && hash(Math.floor(t / THUNDER_EVERY) * 7 + g.skySeed) < 0.35;
const thunderNow = (t) => thunderIn(t) && mod(t, THUNDER_EVERY) < 4;

// ---- what happened this tick: sounds, dust and sparkles ----

const particles = [];
let shake = 0;
let flash = 0;
let deathAt = 0;
let deathX = 0;
let deathY = 0;
let clock = 0;
let frame = 0;

const puff = (x, y, n, color, spread = 0.12, rise = 0.04) => {
    for (let i = 0; i < n; i++) {
        particles.push({
            x: x + (Math.random() - 0.5) * 2,
            y,
            vx: (Math.random() - 0.5) * spread * 2,
            vy: Math.random() * rise,
            life: 10 + Math.random() * 8,
            color,
        });
    }
};

function events(before) {
    const { claude } = g;
    const middle = claude.x + 2.5;
    if (before.phase === "playing" && g.phase === "over") {
        deathAt = clock;
        deathX = claude.x;
        deathY = claude.y;
        shake = 7;
        noise(0.4);
        tone([330, 247, 196, 131], 0.11, "square", 0.05);
        puff(middle, claude.y + 1, 14, CLAUDE.body, 0.35, 0.2);
        return;
    }
    if (g.tunnel !== null && before.tunnel === null) tone([523, 392, 330, 262, 196], 0.06, "triangle", 0.06);
    if (g.tunnel === null && before.tunnel !== null) tone([262, 330, 392, 523, 659, 784], 0.05, "square", 0.04);
    if (g.stage > before.stage) tone([523, 659, 784, 1047, 784, 1047], 0.08);
    if (mod(g.bonus - before.bonus, 500) === 50) {
        tone([988, 1319], 0.07, "square", 0.04);
        puff(middle, claude.y + 1.5, 8, "#ffd84a", 0.3, 0.2);
    }
    if (claude.rope && !before.rope) {
        tone([330, 494], 0.05, "triangle", 0.06);
        puff(middle, claude.y + 2, 4, "#c9a26a", 0.15, 0.05);
        return;
    }
    if (!claude.rope && before.rope) {
        tone([494, 659, 880], 0.04, "square", 0.04);
        return;
    }
    if (claude.vy > 1.3 && before.vy <= 1.3) {
        tone([392, 523, 659, 784, 1047], 0.035, "square", 0.04);
        puff(middle, claude.y, 8, "#ff8ee6", 0.25, 0.05);
    } else if (before.on && !claude.on && claude.vy > 0.5) {
        tone([440, 660], 0.05, "square", 0.035);
        puff(middle, claude.y, 5, "#e8e8f0");
    } else if (!before.on && !claude.on && !claude.rope && claude.vy - before.vy > 0.3) {
        tone([660, 880], 0.04, "triangle", 0.05);
        puff(middle, claude.y, 4, "#cfe8ff");
    } else if (!before.on && claude.on) {
        puff(middle, claude.y, 4, "#e8e8f0", 0.15, 0.02);
    }
    if (g.bolts.some((b) => b.t === BOLT_STRIKE)) {
        flash = 0.35;
        noise(0.25, 0.08);
    }
    // a meteor or a lava bomb coming down: a thud, a shake, and rubble or sparks thrown up
    for (const i of g.impacts) {
        if (i.t !== 11) continue;
        shake = Math.max(shake, i.kind === "meteor" ? 5 : 3);
        noise(0.35, i.kind === "meteor" ? 0.09 : 0.05);
        puff(i.x + 1.5, i.y, 10, i.kind === "meteor" ? "#8a7360" : "#ff7a1a", 0.35, 0.25);
    }
    if (g.strikes.some((s) => s.t === STRIKE_WARNING - 1)) tone([880, 660], 0.05, "square", 0.025);
    fightEvents(before);
}

// a fight's sounds: the boss turning up, every fireball and hit, Claude hurt, and the boss going down
function fightEvents(before) {
    const f = g.fight;
    const was = before.fight;
    if (f && !was) tone([131, 165, 131, 98, 131], 0.14, "square", 0.05);
    if (!f) {
        if (was && g.phase === "playing") {
            tone([523, 659, 784, 1047, 784, 1047, 1319], 0.09, "square", 0.05);
            shake = 6;
        }
        return;
    }
    const b = f.boss;
    if (f.shots.length > before.shots) tone([1175, 880], 0.03, "square", 0.025);
    if (b.hp < before.hp) {
        noise(0.06, 0.05);
        puff(b.x + b.w / 2, b.y + b.h / 2, 3, "#ff9a3a", 0.25, 0.1);
    }
    if (f.hearts < before.hearts) {
        tone([392, 262, 196], 0.07, "sawtooth", 0.05);
        shake = 5;
        puff(g.claude.x + 2.5, g.claude.y + 1, 8, CLAUDE.body, 0.3, 0.15);
    }
    if (b.dying && !before.dying) {
        noise(0.7, 0.1);
        shake = 8;
    }
    // it comes apart in bursts as it goes
    if (b.dying && mod(b.dying, 6) === 0) puff(b.x + Math.random() * b.w, b.y + Math.random() * b.h, 10, b.big ? "#ff8a5a" : "#ffd84a", 0.4, 0.2);
}

// the weather's sounds: thunder after a flash, and a low rumble through an earthquake
function weatherSounds() {
    if (g.tunnel !== null) return;
    if (thunderIn(weatherTicks) && mod(weatherTicks, THUNDER_EVERY) === 3) noise(0.9, 0.05);
    if (sky.disaster === "earthquake" && sky.power > 0.3 && mod(weatherTicks, 24) === 0) noise(0.5, 0.035 * sky.power);
}

// ---- the clock: the rules tick twenty times a second, and the drawing slides smoothly between ticks ----

let prev = null;
function snapshot() {
    const xs = new Map();
    for (const p of g.plates) xs.set(p, p.x);
    const ys = new Map();
    for (const c of g.creatures) {
        xs.set(c, c.x);
        ys.set(c, c.y);
    }
    if (g.fight) {
        xs.set(g.fight.boss, g.fight.boss.x);
        ys.set(g.fight.boss, g.fight.boss.y);
        for (const s of g.fight.shots) xs.set(s, s.x);
    }
    return { ticks: g.ticks, claude: g.claude, cx: g.claude.x, cy: g.claude.y, cam: g.camera, camX: g.camX, xs, ys, tunnel: g.tunnel };
}

function tick() {
    if (held.length && !g.auto && !g.wardrobe) input(g, held[held.length - 1]);
    prev = snapshot();
    const f = g.fight;
    const before = { on: g.claude.on, rope: g.claude.rope, vy: g.claude.vy, bonus: g.bonus, phase: g.phase, stage: g.stage, tunnel: g.tunnel, fight: !!f, shots: f?.shots.length ?? 0, hp: f?.boss.hp ?? 0, hearts: f?.hearts ?? 0, dying: f?.boss.dying ?? 0 };
    autopilot(g);
    step(g);
    events(before);
    weatherTicks += 1;
    sky = g.sky;
    weatherSounds();
    if (g.phase === "over") saveBest();
    for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy -= 0.01;
        p.life -= 1;
    }
    for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
}

let acc = 0;
let last = performance.now();
function loop(now) {
    acc += Math.min(250, now - last);
    last = now;
    while (acc >= TICK_MS) {
        tick();
        acc -= TICK_MS;
    }
    draw(acc / TICK_MS);
    requestAnimationFrame(loop);
}

// ---- where things go on screen ----

// the top pixel of a row, the pixel line at a height (where feet at that height stand), and a cell's left edge
let cam = 0;
let camX = 0;
const rowTop = (y) => Math.round(HUD + (H - 1 - (y - cam)) * CH);
const py = (y) => Math.round(HUD + (H - y + cam) * CH);
const px = (x) => Math.round((x - camX) * CW);

// what Claude is in: a tunnel's era, or the place it has reached
const tunnelNow = () => (g.tunnel !== null ? sectionOf(g, g.tunnel) : null);
const themeNow = () => {
    const sec = tunnelNow();
    return sec ? eraOf(sec.era) : placeOf(g.stage - 1);
};

// ---- the sky: a banded, dithered gradient per place, drawn once and kept ----

const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, t) => {
    const [x, y] = [hex(a), hex(b)];
    return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",")})`;
};
const skies = new Map();
function skyFor(theme) {
    const { name, look } = theme;
    if (skies.has(name)) return skies.get(name);
    const canvasSky = document.createElement("canvas");
    canvasSky.width = VW;
    canvasSky.height = VH - HUD;
    const s = canvasSky.getContext("2d");
    const BANDS = 8;
    const band = canvasSky.height / BANDS;
    for (let b = 0; b < BANDS; b++) {
        s.fillStyle = mix(look.sky[0], look.sky[1], b / (BANDS - 1));
        s.fillRect(0, b * band, VW, band);
        if (b === BANDS - 1) continue;
        // a checkerboard where one band meets the next, the way 16-bit skies faked a gradient
        s.fillStyle = mix(look.sky[0], look.sky[1], (b + 1) / (BANDS - 1));
        for (let y = (b + 1) * band - 4; y < (b + 1) * band; y++) {
            const stepX = y < (b + 1) * band - 2 ? 4 : 2;
            for (let x = mod(y, 2); x < VW; x += stepX) s.fillRect(x, y, 1, 1);
        }
    }
    skies.set(name, canvasSky);
    return canvasSky;
}

// far stars drift slowest, both ways
function drawFar() {
    const fx = camX * CW * 0.15;
    const fy = cam * CH * 0.15;
    for (let i = 0; i < 70; i++) {
        const a = hash(i * 7 + 1);
        const b = hash(i * 13 + 3);
        const x = mod(a * VW * 2 - fx, VW * 2);
        const y = HUD + mod(b * (VH - HUD) * 2 + fy, (VH - HUD) * 2);
        if (x >= VW || y >= VH) continue;
        const twinkle = mod(frame + Math.floor(b * 400), 180) < 10;
        rect(x, y, 1, 1, twinkle ? "#ffffff" : "rgba(255,255,255,0.45)");
        if (a > 0.92) {
            rect(x - 1, y, 3, 1, "rgba(255,255,255,0.35)");
            rect(x, y - 1, 1, 3, "rgba(255,255,255,0.35)");
        }
    }
}

// a skyline far off along the bottom, in the place's own shapes: web towers with aerials, BIOS chips with pins, dark
// spires, cloud server racks, mainframe cabinets, and graphics cards with cooling fins
const SKYLINE = ["aerial", "pins", "spire", "puff", "stripes", "fins"];
// which of those each world has, by name; the rest take turns
const SKYLINE_OF = { WWW: "aerial", BIOS: "pins", "Dark Web": "spire", "AWS Cloud": "puff", IBM: "stripes", Nvidia: "fins", GitHub: "aerial", GitLab: "spire", Git: "pins" };
function drawSkyline(theme, placeIndex) {
    const style = SKYLINE_OF[theme.name] ?? SKYLINE[mod(placeIndex, SKYLINE.length)];
    const look = theme.look;
    const shift = camX * CW * 0.35;
    const base = VH;
    for (let i = Math.floor(shift / 30) - 1; i < Math.floor(shift / 30) + VW / 30 + 2; i++) {
        const w = 18 + Math.floor(hash(i * 3 + 5) * 10);
        const h = 26 + Math.floor(hash(i * 11 + 7) * 50);
        const x = Math.round(i * 30 - shift);
        const top = base - h;
        rect(x, top, w, h, mix(look.dark, "#000000", 0.45));
        rect(x, top, 1, h, mix(look.dark, "#000000", 0.2));
        // lit windows, a few blinking
        for (let wy = top + 5; wy < base - 4; wy += 7) {
            for (let wx = x + 3; wx < x + w - 3; wx += 5) {
                const lit = hash(i * 97 + wx * 7 + wy * 13);
                if (lit < 0.45) rect(wx, wy, 2, 3, lit < 0.06 && mod(frame >> 5, 2) ? look.text : mix(look.light, "#000000", 0.55));
            }
        }
        if (style === "aerial") {
            rect(x + w / 2, top - 10, 1, 10, mix(look.dark, "#000000", 0.3));
            if (mod(frame >> 4, 2)) rect(x + w / 2 - 1, top - 11, 3, 2, "#ff3b3b");
        } else if (style === "pins") {
            for (let p = x + 2; p < x + w - 1; p += 3) rect(p, top - 3, 1, 3, mix(look.light, "#000000", 0.5));
        } else if (style === "spire") {
            for (let k = 0; k < 8; k++) rect(x + w / 2 - (8 - k) / 2, top - k * 2, 8 - k, 2, mix(look.dark, "#000000", 0.45));
        } else if (style === "puff") {
            for (let k = -1; k < 3; k++) rect(x + k * 6, top - 6 + Math.abs(k - 1) * 2, 10, 6, mix(look.light, look.sky[1], 0.6));
        } else if (style === "stripes") {
            for (let sy = top + 2; sy < base; sy += 8) rect(x, sy, w, 1, mix(look.light, "#000000", 0.35));
        } else if (style === "fins") {
            for (let fx2 = x + 1; fx2 < x + w - 1; fx2 += 2) rect(fx2, top - 4, 1, 4, mix(look.plate, "#000000", 0.3));
        }
    }
}

// the place's words, a little nearer than the stars
function drawWords(theme) {
    const near = cam * 0.6;
    const nearX = camX * 0.6;
    ctx.globalAlpha = 0.16;
    for (let r = Math.floor(near) - 1; r <= near + H + 1; r++) {
        const col = mod(r * 37 + 11 - Math.floor(nearX), W * 3);
        if (col >= W) continue;
        const y = Math.round(HUD + (H - 1 - (r - near)) * CH) + 2;
        text(wordFor(theme, r), col * CW - mod(nearX, 1) * CW, y, theme.look.light);
    }
    ctx.globalAlpha = 1;
}

// underground: rock walls in the era's dark colour, a jagged roof, and the dim glow of an old screen
function drawTunnelBack(sec, theme) {
    const look = theme.look;
    const shift = camX * CW * 0.5;
    for (let y = HUD; y < VH; y += 8) {
        const row = Math.floor((y + cam * CH * 0.5) / 8);
        const offset = mod(row, 2) * 8;
        for (let x = -mod(shift + offset, 16); x < VW; x += 16) rect(x, y, 15, 7, mix(look.plate, "#000000", 0.75 + hash(row * 31 + Math.floor((x + shift) / 16)) * 0.15));
    }
    const roof = py(sec.roof);
    if (roof > HUD) {
        rect(0, HUD, VW, roof - HUD, mix(look.plate, "#000000", 0.85));
        for (let x = -mod(camX * CW, 12); x < VW; x += 12) {
            const k = Math.floor((x + camX * CW) / 12);
            const drip = 4 + Math.floor(hash(k * 5) * 10);
            for (let d = 0; d < drip; d++) rect(x + d / 2, roof + d, 10 - d, 1, mix(look.plate, "#000000", 0.8));
        }
    }
}

// ---- plates ----

function block(x, y, cells, fill, light, dark) {
    const w = cells * CW;
    rect(x, y, w, CH, INK);
    rect(x + 1, y + 1, w - 2, CH - 2, fill);
    rect(x + 1, y + 1, w - 2, 1, light);
    rect(x + 1, y + CH - 2, w - 2, 1, dark);
}

function codeBlock(x, y, cells, theme, n, from = 0, inside = cells) {
    const { look } = theme;
    block(x, y, cells, look.plate, look.light, look.dark);
    const { line, left } = codeLine(theme, n, inside);
    [...line].forEach((ch, i) => text(ch, x + (from + left + i) * CW, y + 2, look.text));
}

function arrow(x, y, dir) {
    for (let c = 0; c < 4; c++) {
        const col = dir < 0 ? x + c : x + 3 - c;
        rect(col, y + 5 - c, 1, 2 + 2 * c, "#8ff7ff");
    }
}

function drawPlate(p, at) {
    const x = px(at);
    const y = rowTop(p.y);
    if (y > VH || y < HUD - CH * 2 || x > VW || x + p.len * CW < 0) return;
    const theme = themeOf(p);
    if (p.kind === "plain") codeBlock(x, y, p.len, theme, p.n);
    if (p.kind === "moving") {
        codeBlock(x, y, p.len, theme, p.n, 1, p.len - 2);
        arrow(x + 2, y, -1);
        arrow(x + p.len * CW - 6, y, 1);
    }
    if (p.kind === "crumble") {
        // old code turned to stone: it shakes and cracks once stood on, then gives way
        const breaking = p.t > 0 ? 1 - p.t / CRUMBLE_TICKS : 0;
        const sx = p.t > 0 ? (mod(frame >> 1, 2) ? 1 : -1) : 0;
        block(x + sx, y, p.len, breaking > 0.5 ? "#6d6052" : "#8b7b68", "#b3a48f", "#5a4c3d");
        for (let i = 2; i < p.len * CW - 2; i += 16) rect(x + sx + i + (p.y % 2) * 8, y + 2, 1, CH - 4, "#5a4c3d");
        if (breaking > 0) {
            for (let i = 0; i < p.len; i += 2) {
                if (hash(p.n * 31 + i) > breaking) continue;
                const cx = x + sx + i * CW + 3;
                rect(cx, y + 2, 1, 3, INK);
                rect(cx + 1, y + 5, 1, 3, INK);
                rect(cx, y + 8, 1, 2, INK);
            }
        }
    }
    if (p.kind === "spring") {
        block(x, y, p.len, "#ff4fd8", "#ffa6ef", "#a3238a");
        for (let i = 0; i < p.len; i++) text("+", x + i * CW, y + 2, "#ffffff");
        if (mod(frame >> 3, 2)) {
            for (let i = 1; i < p.len; i += 3) {
                const cx = x + i * CW + 4;
                rect(cx - 1, y - 5, 2, 1, "#ffa6ef");
                rect(cx - 2, y - 4, 1, 1, "#ffa6ef");
                rect(cx + 1, y - 4, 1, 1, "#ffa6ef");
            }
        }
    }
    if (p.kind === "spike") {
        // a good line of code with a syntax error stuck on one end
        const atStart = p.spikeX === p.x;
        const safe = p.len - p.spikeLen;
        const safeX = atStart ? x + p.spikeLen * CW : x;
        const errX = atStart ? x : x + safe * CW;
        codeBlock(safeX, y, safe, theme, p.n);
        block(errX, y, p.spikeLen, "#e0303a", "#ff7a80", "#8a0f17");
        for (let i = 0; i < p.spikeLen; i++) {
            const cx = errX + i * CW;
            for (let j = 0; j < 4; j++) rect(cx + 3 - j, y - 4 + j, 2 + 2 * j, 1, j === 0 ? "#ffd0d0" : "#ff4a52");
            text("!", cx, y + 2, "#ffffff");
        }
    }
    if (p.kind === "top") {
        // the cloud top: puffy, as wide as the climb, and it says which place comes next
        const w = p.len * CW;
        for (let i = -6; i < w + 12; i += 22) {
            const r = 7 + Math.floor(hash(i * 3 + p.n) * 5);
            const cx = x + i + 11;
            for (let dy = 0; dy <= r; dy++) {
                const hw = Math.round(Math.sqrt(r * r - dy * dy));
                rect(cx - hw - 1, y + 3 - dy, hw * 2 + 2, 1, dy === r ? "#c9d6f0" : "#f4f8ff");
            }
        }
        rect(x, y, w, CH, "#f4f8ff");
        rect(x, y + CH - 3, w, 3, "#b9c8e8");
        const next = placeOf(p.zone).name.toUpperCase();
        const label = p.done ? `${next} ZONE` : `UP NEXT: ${next}`;
        ctx.font = `8px ${FONT}`;
        text(label, x + (w - ctx.measureText(label).width) / 2, y + 2, "#1d2b5a");
    }
}

// ---- ropes, doors and the way out of a tunnel ----

function drawRope(r) {
    const { claude } = g;
    const ax = px(r.ax);
    const ay = py(r.ay);
    if (ax < -120 || ax > VW + 120) return;
    let ex;
    let ey;
    if (claude.rope?.n === r.n) {
        // held: down to Claude's hands, wherever the drawing has slid Claude to
        ex = px(drawnCx + 2.5);
        ey = py(drawnCy + HANDS);
    } else {
        // hanging free, swaying a little in the breeze
        const a = Math.sin(clock * 1.3 + r.n) * 0.06;
        ex = ax + Math.sin(a) * r.len * CH;
        ey = ay + Math.cos(a) * r.len * CH;
    }
    // the beam it hangs from
    rect(ax - 9, ay - 5, 18, 5, INK);
    rect(ax - 8, ay - 4, 16, 3, "#5c6170");
    rect(ax - 8, ay - 4, 16, 1, "#9aa0b0");
    const steps = Math.max(4, Math.ceil(Math.hypot(ex - ax, ey - ay) / 2));
    for (let i = 0; i <= steps; i++) {
        const x = ax + ((ex - ax) * i) / steps;
        const y = ay + ((ey - ay) * i) / steps;
        rect(x - 1, y, 2, 2, mod(i, 3) === 0 ? "#7a5530" : "#c9a26a");
    }
    if (claude.rope?.n !== r.n) rect(ex - 2, ey - 1, 4, 3, "#7a5530");
}

function drawDoor(d) {
    const era = eraOf(d.era);
    const x = px(d.x);
    const base = py(d.y + 1);
    if (x < -60 || x > VW + 60) return;
    const w = 32;
    const h = 30;
    // a stone archway glowing in the era's colour, dark inside, with lines of old code flickering in the dark
    rect(x - 3, base - h - 3, w + 6, h + 3, INK);
    rect(x - 2, base - h - 2, w + 4, h + 2, d.used ? "#3a3a3a" : era.look.light);
    rect(x, base - h, w, h, "#030303");
    if (!d.used) {
        for (let line = 0; line < 4; line++) {
            const len = 4 + Math.floor(hash(d.n * 7 + line + (frame >> 4)) * 20);
            rect(x + 4, base - h + 5 + line * 6, len, 2, mix(era.look.light, "#000000", 0.5));
        }
    } else {
        for (let k = 0; k < 3; k++) rect(x - 2, base - h + 6 + k * 8, w + 4, 3, "#6d5a40");
    }
    const name = era.name.toUpperCase();
    ctx.font = `8px ${FONT}`;
    const nw = ctx.measureText(name).width;
    text(name, x + w / 2 - nw / 2 + 1, base - h - 13, INK);
    text(name, x + w / 2 - nw / 2, base - h - 14, d.used ? "#777777" : era.look.light);
    // a bouncing arrow when Claude is standing in it: press down to go in
    if (!d.used && doorAt(g) === d && !g.auto) {
        const bob = mod(frame >> 3, 2) * 2;
        for (let k = 0; k < 4; k++) rect(x + w / 2 - 4 + k, base - h - 26 + bob + k, 8 - k * 2, 1, "#ffffff");
    }
}

function drawExit(sec) {
    const x = px(sec.exit.x);
    const base = py(sec.exit.y + 1);
    const w = 32;
    const h = 30;
    const glow = mod(frame >> 3, 2) ? "#ffe680" : "#ffd84a";
    rect(x - 3, base - h - 3, w + 6, h + 3, INK);
    rect(x - 2, base - h - 2, w + 4, h + 2, glow);
    rect(x, base - h, w, h, "#fff4c0");
    for (let k = 0; k < 4; k++) rect(x + 6 + k * 6, base - h + 4, 2, h - 4, "rgba(255,255,255,0.7)");
    ctx.font = `8px ${FONT}`;
    text("EXIT", x + w / 2 - ctx.measureText("EXIT").width / 2, base - h - 14, glow);
}

// ---- the rest of the cast ----

const STAR = ["...o...", "..ooo..", "ooooooo", ".ooooo.", "..ooo..", ".oo.oo.", "oo...oo"];
function drawStar(s) {
    const bob = Math.round(Math.sin((frame + s.x * 9) / 10) * 1.5);
    const x = px(s.x);
    const y = rowTop(s.y) + 2 + bob;
    if (x < -8 || x > VW) return;
    STAR.forEach((row, r) => [...row].forEach((ch, c) => ch === "o" && rect(x + c, y + r, 1, 1, r < 3 ? "#ffe680" : "#ffc21a")));
}

// a bug: a green beetle with see-through wings, buzzing back and forth
function drawBug(b, at) {
    const x = px(at);
    const y = rowTop(b.y);
    if (x < -24 || x > VW + 8) return;
    const flap = mod(frame >> 2, 2);
    const f = b.dir;
    const cx = x + 12 - f * 2;
    const cy = y + 6;
    ctx.globalAlpha = 0.75;
    if (flap) {
        rect(cx - 7, cy - 9, 5, 4, "#d8f6ff");
        rect(cx, cy - 9, 5, 4, "#d8f6ff");
    } else {
        rect(cx - 8, cy - 5, 6, 2, "#d8f6ff");
        rect(cx + 1, cy - 5, 6, 2, "#d8f6ff");
    }
    ctx.globalAlpha = 1;
    for (const lx of [-5, -1, 3]) rect(cx + lx + flap, cy + 3, 1, 3, "#10240f");
    const shell = [[-4, 8], [-3, 12], [-2, 14], [-1, 14], [0, 14], [1, 12], [2, 10]];
    rect(cx - 4, cy - 5, 8, 1, INK);
    rect(cx - 5, cy + 3, 10, 1, INK);
    for (const [dy, w] of shell) rect(cx - w / 2 - 1, cy + dy, w + 2, 1, INK);
    for (const [dy, w] of shell) rect(cx - w / 2, cy + dy, w, 1, dy < -2 ? "#7cf08a" : "#3fcf52");
    rect(cx - 3, cy - 2, 2, 2, "#1f7a2c");
    rect(cx + 2, cy - 1, 2, 2, "#1f7a2c");
    const hx = cx + f * 8 - 2;
    rect(hx - 1, cy - 3, 6, 6, INK);
    rect(hx, cy - 2, 4, 4, "#1f7a2c");
    rect(hx + (f > 0 ? 2 : 0), cy - 2, 2, 2, "#ffffff");
    rect(hx + (f > 0 ? 3 : 0), cy - 1, 1, 1, INK);
    rect(hx + (f > 0 ? 4 : -1), cy - 4, 1, 1, INK);
    rect(hx + (f > 0 ? 5 : -2), cy - 5, 1, 1, INK);
}

function drawBolt(b) {
    const x = px(b.x);
    if (b.t > BOLT_STRIKE) {
        // the warning: a red column and flashing signs where the exception will land
        const blink = mod(frame >> 3, 2);
        rect(x, HUD, 24, VH - HUD, blink ? "rgba(255,60,60,0.16)" : "rgba(255,60,60,0.08)");
        for (let y = HUD + 6; y < VH; y += CH * 2) text("!", x + 8, y, blink ? "#ffdd33" : "#ff4a4a");
        return;
    }
    rect(x, HUD, 24, VH - HUD, "rgba(255,255,210,0.16)");
    for (let y = HUD, seg = 0; y < VH; y += 6, seg++) {
        const zig = [0, 3, 5, 2, -2, -4, -1][seg % 7];
        rect(x + 7 + zig, y, 10, 6, "rgba(255,236,120,0.45)");
        rect(x + 10 + zig, y, 4, 6, "#ffffff");
    }
}

// Claude: an orange rectangle with two eyes, two arms out to the sides (or up, on a rope) and four feet
// ---- the characters, and what they wear ----

// each character in pixels: its colours, its body's shape, its eyes, arms and legs, and anything of its own. they all
// fill the same box as Claude, so a hat, glasses or a tie sits in the same place on every one of them
const CHARS = {
    claude: { body: "#d97757", light: "#eda183", shade: "#b0573a", ink: "#2b1209", eye: "#141414", round: 0, eyes: "tall", arms: "nub", legs: 4 },
    gpt: { body: "#2b2f36", light: "#4a515c", shade: "#1a1d22", ink: "#0a0b0d", eye: "#7df2c8", round: 3, eyes: "round", arms: "nub", legs: 4, extra: "smile", accent: "#10a37f" },
    qwen: { body: "#7b5cff", light: "#a48cff", shade: "#5a3fd6", ink: "#1e1050", eye: "#ffffff", round: 5, eyes: "round", arms: "nub", legs: 2, extra: "sprout", accent: "#5be38a" },
    grok: { body: "#16161a", light: "#3a3a42", shade: "#050507", ink: "#e8e8ee", eye: "#f4f4f8", round: 0, eyes: "smug", arms: "nub", legs: 4 },
    hugging: { body: "#ffd21e", light: "#ffe36e", shade: "#e0a800", ink: "#5a3a00", eye: "#3a2400", round: 6, eyes: "happy", arms: "hands", legs: 2, extra: "grin", accent: "#ff8a5a" },
    openclaw: { body: "#e0352b", light: "#ff6a5a", shade: "#a8201a", ink: "#3a0806", eye: "#141414", round: 3, eyes: "stalk", arms: "claws", legs: 4, extra: "feelers" },
    gemini: { body: "#4c7cf3", light: "#8ab0ff", shade: "#3058c8", ink: "#101a40", eye: "#ffffff", round: 3, eyes: "round", arms: "nub", legs: 4, extra: "twins", fade: "#9b5cf0", accent: "#ffe27a" },
    deepseek: { body: "#4d6bfe", light: "#8ea0ff", shade: "#2f48c8", ink: "#0c1550", eye: "#141414", round: 5, eyes: "round", arms: "fin", legs: 2, extra: "whale" },
    llama: { body: "#f1e3c8", light: "#fff6e4", shade: "#cdb48a", ink: "#5a4630", eye: "#2a1c0e", round: 2, eyes: "tall", arms: "nub", legs: 4, extra: "ears", accent: "#d9a7a0" },
    mistral: { body: "#ff8205", light: "#ffd800", shade: "#e10500", ink: "#3a1200", eye: "#141414", round: 0, eyes: "tall", arms: "nub", legs: 4, extra: "stripes", stripes: ["#ffd800", "#ffaf00", "#ff8205", "#fa500f", "#e10500"] },
    copilot: { body: "#1aa0b8", light: "#5fd3e6", shade: "#0d6f82", ink: "#06303a", eye: "#ffffff", round: 3, eyes: "round", arms: "nub", legs: 4, extra: "pilot" },
};

// a box with its corners rounded off by r pixels, row by row
function roundBox(x, y, w, h, r, color) {
    for (let row = 0; row < h; row++) {
        const fromEdge = Math.min(row, h - 1 - row);
        const cut = fromEdge >= r ? 0 : Math.round(r - Math.sqrt(r * r - (r - fromEdge - 0.5) ** 2));
        rect(x + cut, y + row, w - cut * 2, 1, color);
    }
}

// a little cone from a point down to a base, for hats and spikes
function cone(cx, tipY, baseY, half, color, lean = 0) {
    const h = baseY - tipY;
    for (let k = 0; k <= h; k++) {
        const w = Math.max(1, Math.round((half * 2 * k) / h));
        rect(cx - w / 2 + lean * (1 - k / h), tipY + k, w, 1, color);
    }
}

function drawCape(bx, top, bottom, dir, moving) {
    const flutter = moving ? Math.sin(frame / 4) * 2 : 0;
    const back = dir > 0 ? bx - 2 : bx + 30;
    for (let k = 0; k < bottom - top - 1; k++) {
        const spread = 3 + k * 0.45 + (k > 4 ? flutter * (k / 20) : 0);
        const x = dir > 0 ? back - spread : back;
        rect(x - 1, top + 2 + k, spread + 2, 1, "#4a0a0a");
        rect(x, top + 2 + k, spread, 1, k % 6 < 3 ? "#c62828" : "#b01e1e");
    }
}

function drawHat(id, cx, ty, dir, bx, bw) {
    const ink = INK;
    if (id === "cap") {
        roundBox(cx - 13, ty - 7, 26, 8, 4, ink);
        roundBox(cx - 12, ty - 6, 24, 7, 4, "#2b6fd6");
        rect(cx - 12, ty - 5, 24, 1, "#5a96f0");
        rect(dir > 0 ? cx + 6 : cx - 19, ty - 2, 13, 3, ink);
        rect(dir > 0 ? cx + 7 : cx - 18, ty - 1, 11, 1, "#1d4fa0");
        rect(cx - 1, ty - 8, 3, 2, "#1d4fa0");
    } else if (id === "tophat") {
        rect(cx - 15, ty - 4, 30, 4, ink);
        rect(cx - 14, ty - 3, 28, 2, "#2a2a32");
        rect(cx - 10, ty - 17, 20, 14, ink);
        rect(cx - 9, ty - 16, 18, 13, "#2a2a32");
        rect(cx - 9, ty - 16, 2, 13, "#44444f");
        rect(cx - 9, ty - 7, 18, 3, "#b0202a");
    } else if (id === "crown") {
        rect(cx - 12, ty - 6, 24, 6, ink);
        rect(cx - 11, ty - 5, 22, 4, "#f2c230");
        for (const px of [-10, -1, 8]) {
            rect(cx + px - 1, ty - 12, 5, 7, ink);
            rect(cx + px, ty - 11, 3, 6, "#f2c230");
        }
        rect(cx - 9, ty - 4, 2, 2, "#e8303a");
        rect(cx, ty - 4, 2, 2, "#2f7bff");
        rect(cx + 8, ty - 4, 2, 2, "#3fcf52");
        rect(cx - 11, ty - 5, 22, 1, "#fff0a0");
    } else if (id === "beanie") {
        roundBox(cx - 14, ty - 10, 28, 11, 6, ink);
        roundBox(cx - 13, ty - 9, 26, 10, 6, "#c2185b");
        for (let k = cx - 11; k < cx + 12; k += 4) rect(k, ty - 8, 1, 6, "#e04a86");
        rect(cx - 14, ty - 3, 28, 4, ink);
        rect(cx - 13, ty - 2, 26, 2, "#8e1043");
        rect(cx - 3, ty - 14, 7, 6, ink);
        rect(cx - 2, ty - 13, 5, 4, "#ffffff");
    } else if (id === "wizard") {
        cone(cx, ty - 22, ty - 2, 12, ink, -dir * 5);
        cone(cx, ty - 21, ty - 3, 11, "#3d3dbd", -dir * 5);
        rect(cx - 16, ty - 3, 32, 3, ink);
        rect(cx - 15, ty - 2, 30, 1, "#2a2a90");
        for (const [sx, sy] of [[-4, -7], [3, -12], [-1, -16]]) rect(cx + sx, ty + sy, 2, 2, "#ffe27a");
    } else if (id === "party") {
        for (let k = 0; k < 16; k++) {
            const w = Math.max(1, Math.round(k * 1.1));
            rect(cx - w / 2 - 1, ty - 17 + k, w + 2, 1, ink);
            rect(cx - w / 2, ty - 17 + k, w, 1, mod(k, 4) < 2 ? "#ff5aa8" : "#ffe27a");
        }
        rect(cx - 2, ty - 21, 5, 5, "#5ad1ff");
    } else if (id === "propeller") {
        roundBox(cx - 13, ty - 7, 26, 8, 4, ink);
        roundBox(cx - 12, ty - 6, 12, 7, 4, "#e8303a");
        roundBox(cx, ty - 6, 12, 7, 4, "#2f7bff");
        rect(cx - 12, ty - 2, 24, 2, "#ffd83a");
        rect(cx - 1, ty - 11, 2, 5, ink);
        const spin = Math.round(Math.abs(Math.cos(frame / 3)) * 11) + 1;
        rect(cx - spin, ty - 12, spin * 2, 2, "#ffd83a");
        rect(cx - spin, ty - 12, spin * 2, 1, "#fff3a0");
    } else if (id === "spiky" || id === "golden") {
        const gold = id === "golden";
        const hair = gold ? "#ffd83a" : "#1d1d26";
        const lit = gold ? "#fff3a0" : "#4a4a5c";
        // big spikes sweeping up and out, and two hanging down at the sides
        const spikes = [[-17, 9, -9], [-10, 16, -5], [-2, 20, -1], [6, 17, 4], [13, 11, 8]];
        for (const [sx, h, lean] of spikes) cone(cx + sx + 2, ty - h - 1, ty + 1, 7, INK, lean);
        for (const [sx, h, lean] of spikes) cone(cx + sx + 2, ty - h, ty, 6, hair, lean);
        for (const side of [-1, 1]) {
            const hx = side < 0 ? bx - 4 : bx + bw - 2;
            rect(hx - 1, ty - 2, 7, 9, INK);
            rect(hx, ty - 1, 5, 7, hair);
        }
        rect(bx - 3, ty - 3, bw + 6, 5, INK);
        rect(bx - 2, ty - 2, bw + 4, 4, hair);
        for (const [sx, h, lean] of spikes) rect(cx + sx + 1 + lean * 0.5, ty - h + 5, 2, 4, lit);
        // the golden kind crackles with sparks
        if (gold) {
            for (let k = 0; k < 6; k++) {
                const r = hash(k * 31 + (frame >> 2));
                if (r < 0.5) continue;
                const sx = bx - 8 + hash(k * 17 + (frame >> 2)) * (bw + 16);
                const sy = ty - 20 + hash(k * 7 + (frame >> 2)) * 34;
                rect(sx, sy, 2, 2, "#fff3a0");
                rect(sx - 2, sy + 0.5, 6, 1, "rgba(255,230,90,0.6)");
            }
        }
    }
}

function drawEyewear(id, ex0, ex1, ey, bx, bw) {
    if (id === "sunglasses") {
        for (const ex of [ex0, ex1]) {
            rect(ex - 2, ey - 1, 8, 6, INK);
            rect(ex - 1, ey, 6, 4, "#1c1c24");
            rect(ex, ey, 2, 1, "#8a8aa0");
        }
        rect(ex0 + 6, ey, ex1 - ex0 - 8, 1, INK);
        rect(bx, ey, ex0 - 2 - bx, 1, INK);
        rect(ex1 + 6, ey, bx + bw - ex1 - 6, 1, INK);
    } else if (id === "round") {
        for (const ex of [ex0, ex1]) {
            rect(ex - 3, ey - 2, 9, 1, "#2a2a33");
            rect(ex - 3, ey + 6, 9, 1, "#2a2a33");
            rect(ex - 3, ey - 1, 1, 7, "#2a2a33");
            rect(ex + 5, ey - 1, 1, 7, "#2a2a33");
            ctx.globalAlpha = 0.25;
            rect(ex - 2, ey - 1, 7, 7, "#d8f6ff");
            ctx.globalAlpha = 1;
        }
        rect(ex0 + 6, ey + 1, ex1 - ex0 - 9, 1, "#2a2a33");
    } else if (id === "visor") {
        rect(bx - 2, ey - 3, bw + 4, 9, INK);
        rect(bx - 1, ey - 2, bw + 2, 7, "#13a9c2");
        rect(bx - 1, ey - 2, bw + 2, 2, "#5fe8ff");
        rect(bx + 2 + mod(frame >> 2, bw - 6), ey + 1, 3, 1, "#d8fbff");
    } else if (id === "monocle") {
        rect(ex1 - 3, ey - 2, 9, 1, "#f0c040");
        rect(ex1 - 3, ey + 6, 9, 1, "#f0c040");
        rect(ex1 - 3, ey - 1, 1, 7, "#f0c040");
        rect(ex1 + 5, ey - 1, 1, 7, "#f0c040");
        for (let k = 0; k < 7; k++) rect(ex1 + 5 + (k % 2), ey + 7 + k, 1, 1, "#f0c040");
    } else if (id === "pixel") {
        rect(ex0 - 4, ey - 1, ex1 - ex0 + 11, 2, INK);
        for (const ex of [ex0, ex1]) {
            rect(ex - 2, ey + 1, 7, 2, INK);
            rect(ex - 1, ey + 3, 5, 2, INK);
            rect(ex, ey + 1, 1, 1, "#ffffff");
            rect(ex + 1, ey + 2, 1, 1, "#ffffff");
        }
    } else if (id === "3d") {
        for (const [ex, lens] of [[ex0, "#e8303a"], [ex1, "#2f7bff"]]) {
            rect(ex - 3, ey - 2, 9, 8, "#f4f4f8");
            rect(ex - 2, ey - 1, 7, 6, lens);
        }
        rect(ex0 + 6, ey, ex1 - ex0 - 9, 2, "#f4f4f8");
    }
}

function drawClothes(id, bx, bw, top, bh, bottom) {
    const cx = bx + bw / 2;
    if (id === "tie") {
        rect(cx - 3, top + bh - 6, 6, 4, INK);
        rect(cx - 2, top + bh - 5, 4, 2, "#d02030");
        for (let k = 0; k < bottom - (top + bh) + 3; k++) {
            const w = k > bottom - (top + bh) ? 2 : 4;
            rect(cx - w / 2 - 1, top + bh - 2 + k, w + 2, 1, INK);
            rect(cx - w / 2, top + bh - 2 + k, w, 1, k % 3 ? "#d02030" : "#a01422");
        }
    } else if (id === "bowtie") {
        const y = top + bh - 6;
        rect(cx - 8, y - 1, 16, 7, INK);
        rect(cx - 7, y, 5, 5, "#d81b9a");
        rect(cx + 2, y, 5, 5, "#d81b9a");
        rect(cx - 2, y + 1, 4, 3, "#ff6ad0");
    } else if (id === "scarf") {
        rect(bx - 2, top + bh - 5, bw + 4, 6, INK);
        rect(bx - 1, top + bh - 4, bw + 2, 4, "#2a8cf0");
        for (let k = bx + 1; k < bx + bw; k += 5) rect(k, top + bh - 4, 2, 4, "#e8f2ff");
        const sway = Math.round(Math.sin(frame / 6) * 2);
        rect(bx + bw - 7 + sway, top + bh, 6, 7, INK);
        rect(bx + bw - 6 + sway, top + bh, 4, 6, "#2a8cf0");
    } else if (id === "hoodie") {
        const hood = "#5b5bd6";
        rect(bx - 4, top - 4, bw + 8, 5, INK);
        rect(bx - 4, top - 4, 5, bh + 5, INK);
        rect(bx + bw - 1, top - 4, 5, bh + 5, INK);
        rect(bx - 3, top - 3, bw + 6, 3, hood);
        rect(bx - 3, top - 3, 3, bh + 3, hood);
        rect(bx + bw, top - 3, 3, bh + 3, hood);
        rect(bx - 3, top - 3, bw + 6, 1, "#8484f0");
        rect(cx - 5, top + bh - 1, 1, 4, "#f4f4f8");
        rect(cx + 4, top + bh - 1, 1, 4, "#f4f4f8");
    } else if (id === "labcoat") {
        for (const x of [bx - 1, bx + bw - 8]) {
            rect(x, top + bh - 8, 9, 9, INK);
            rect(x + 1, top + bh - 7, 7, 7, "#f4f4f8");
        }
        rect(bx + 6, top + bh - 7, 1, 7, "#b8b8c8");
        rect(bx + bw - 7, top + bh - 7, 1, 7, "#b8b8c8");
        rect(bx + bw - 6, top + bh - 6, 3, 1, "#2f7bff");
    }
}

// a character where it stands: x is the left of its box and bottom the line its feet are on. the pose (from claudePose)
// says how it stands; look is what it is and wears, the player's own unless given
function drawClaude(x, bottom, pose = {}, look = g.look) {
    const { legs = 5, armDy = 0, bob = 0, stride = -1, eyes = "open", look: glance = 0, armsUp = false, dir = 1, moving = false } = pose;
    const parts = lookParts(look);
    const c = CHARS[parts.character.id] ?? CHARS.claude;
    const coat = parts.clothes.id === "labcoat";
    const bx = x + 6;
    const bw = 28;
    const bh = 14;
    const top = bottom - legs - bh + bob;
    const cx = bx + bw / 2;

    if (parts.clothes.id === "cape") drawCape(bx, top, bottom, dir, moving);
    // a whale's tail, behind
    if (c.extra === "whale") {
        const tx = dir > 0 ? bx - 7 : bx + bw + 1;
        const flick = mod(frame >> 4, 2);
        rect(tx - 1, top + 3 - flick, 8, 7, c.ink);
        rect(tx, top + 4 - flick, 6, 5, c.shade);
    }
    // a llama's ears, behind its head
    if (c.extra === "ears") {
        for (const ex of [bx + 3, bx + bw - 8]) {
            rect(ex - 1, top - 8, 7, 10, c.ink);
            rect(ex, top - 7, 5, 9, c.body);
            rect(ex + 2, top - 5, 1, 5, c.accent);
        }
    }
    // a lobster's feelers
    if (c.extra === "feelers") {
        for (let k = 0; k < 10; k++) {
            rect(bx + 4 - k * 0.8, top - 2 - k, 1, 1, c.shade);
            rect(bx + bw - 5 + k * 0.8, top - 2 - k, 1, 1, c.shade);
        }
    }

    // legs: four short ones, or two for the rounder characters
    const legXs = c.legs === 2 ? [6, 18] : [3, 9, 16, 22];
    legXs.forEach((lx, i) => {
        const lift = stride >= 0 && i % 2 === stride ? 2 : 0;
        const lh = bottom - lift - (top + bh);
        rect(bx + lx - 1, top + bh, 5, lh + 1, c.ink === "#e8e8ee" ? "#2a2a30" : c.ink);
        rect(bx + lx, top + bh, 3, lh, coat ? "#f4f4f8" : c.shade);
    });

    // arms: little nubs, claws, open hands, or fins; up on a rope
    const arm = coat ? "#f4f4f8" : c.body;
    if (armsUp) {
        for (const ax of [bx + 8, bx + 15]) {
            rect(ax, top - 9, 5, 10, c.ink);
            rect(ax + 1, top - 8, 3, 9, arm);
        }
        if (c.arms === "claws") for (const ax of [bx + 6, bx + 15]) {
            rect(ax, top - 13, 8, 5, c.ink);
            rect(ax + 1, top - 12, 6, 3, c.body);
            rect(ax + 3, top - 12, 2, 2, c.ink);
        }
    } else {
        const ay = top + 5 + armDy;
        for (const side of [-1, 1]) {
            const ax = side < 0 ? bx - 6 : bx + bw - 1;
            if (c.arms === "claws") {
                const kx = side < 0 ? bx - 10 : bx + bw - 1;
                rect(kx, ay - 4, 11, 10, c.ink);
                rect(kx + 1, ay - 3, 9, 8, c.body);
                rect(kx + 1, ay - 3, 9, 2, c.light);
                rect(kx + (side < 0 ? 1 : 5), ay - 1, 4, 2, c.ink);
            } else if (c.arms === "hands") {
                // open hands out front, ready for a hug
                const hx = side < 0 ? bx - 8 : bx + bw - 1;
                rect(hx, ay - 1, 9, 8, c.ink);
                rect(hx + 1, ay, 7, 6, arm);
                for (let f = 0; f < 3; f++) rect(hx + 1 + f * 2 + (side < 0 ? 0 : 1), ay - 3, 1, 3, c.ink);
            } else if (c.arms === "fin") {
                rect(ax, ay + 1, 7, 4, c.ink);
                rect(ax + 1, ay + 2, 5, 2, c.shade);
            } else {
                rect(ax, ay - 1, 7, 6, c.ink);
                rect(ax + 1, ay, 5, 4, arm);
            }
        }
    }

    // the body, which is the face too
    roundBox(bx - 1, top - 1, bw + 2, bh + 2, c.round + 1, c.ink);
    roundBox(bx, top, bw, bh, c.round, c.body);
    if (c.extra === "stripes") {
        c.stripes.forEach((s, i) => rect(bx, top + 1 + i * 3, bw, 3, s));
        rect(bx, top, bw, 1, c.stripes[0]);
    } else if (c.fade) {
        for (let k = 0; k < bw; k += 2) {
            ctx.globalAlpha = (k / bw) * 0.85;
            rect(bx + k, top + 1, 2, bh - 2, c.fade);
        }
        ctx.globalAlpha = 1;
    } else {
        rect(bx + c.round, top, bw - c.round * 2, 1, c.light);
        rect(bx + c.round, top + bh - 2, bw - c.round * 2, 2, c.shade);
        rect(bx + bw - 1, top + c.round, 1, bh - c.round * 2, c.shade);
    }
    if (c.extra === "whale") rect(bx + 6, top + bh - 4, bw - 12, 3, "#e8eeff");
    if (c.extra === "smile") rect(cx - 4, top + 11, 8, 1, c.accent);
    if (c.extra === "grin") {
        rect(cx - 5, top + 9, 10, 1, c.ink);
        rect(cx - 4, top + 10, 8, 2, c.ink);
        rect(cx - 3, top + 11, 6, 1, c.accent);
    }
    if (c.extra === "sprout") {
        rect(cx, top - 5, 1, 5, c.ink);
        rect(cx - 3, top - 7, 4, 2, c.accent);
        rect(cx + 1, top - 6, 4, 2, c.accent);
    }
    if (c.extra === "twins") {
        for (const ax of [cx - 7, cx + 6]) {
            rect(ax, top - 5, 1, 5, c.ink);
            rect(ax - 1, top - 8, 3, 3, c.accent);
        }
    }
    if (c.extra === "ears") {
        rect(cx - 4, top + 9, 8, 4, c.light);
        rect(cx - 2, top + 10, 1, 1, c.ink);
        rect(cx + 1, top + 10, 1, 1, c.ink);
    }

    // eyes: each character's own when they're plain open, and the same blink, wide eyes, smile and knock-out for all
    const stalks = c.eyes === "stalk";
    const ey = stalks ? top - 6 : top + 4;
    const ex0 = bx + 7 + glance;
    const ex1 = bx + 18 + glance;
    for (const ex of [ex0, ex1]) {
        if (stalks) {
            rect(ex + 1, top - 2, 1, 3, c.ink);
            rect(ex - 1, ey - 1, 6, 6, c.ink);
            rect(ex, ey, 4, 4, "#ffffff");
        }
        const style = eyes === "open" ? c.eyes : eyes;
        if (style === "dead") {
            for (let i = 0; i < 4; i++) {
                rect(ex + i - 1, ey + i, 1, 1, c.eye === "#ffffff" ? INK : c.eye);
                rect(ex + 2 - i, ey + i, 1, 1, c.eye === "#ffffff" ? INK : c.eye);
            }
        } else if (style === "blink") {
            rect(ex, ey + 3, 3, 1, c.eye === "#ffffff" ? INK : c.eye);
        } else if (style === "happy") {
            const e = c.eye === "#ffffff" ? INK : c.eye;
            rect(ex, ey + 2, 1, 2, e);
            rect(ex + 1, ey + 1, 1, 1, e);
            rect(ex + 2, ey + 2, 1, 2, e);
        } else if (style === "round") {
            rect(ex - 1, ey, 5, 5, c.eye);
            rect(ex + (glance >= 0 ? 1 : 0), ey + 1, 2, 3, c.eye === "#ffffff" ? INK : "#0a3a2c");
        } else if (style === "smug") {
            rect(ex - 1, ey + 1, 5, 1, c.ink);
            rect(ex - 1, ey + 2, 5, 2, c.eye);
            rect(ex + (glance >= 0 ? 2 : 0), ey + 2, 2, 2, INK);
        } else if (style === "stalk") {
            rect(ex + 1, ey + 1, 2, 2, c.eye);
        } else {
            const tall = style === "wide" ? 6 : 5;
            rect(ex, ey - (tall - 5), 3, tall, c.eye);
            rect(ex, ey - (tall - 5), 1, 1, "#ffffff");
        }
    }

    if (parts.clothes.id !== "none" && parts.clothes.id !== "cape") drawClothes(parts.clothes.id, bx, bw, top, bh, bottom);
    if (parts.eyewear.id !== "none" && eyes !== "dead") drawEyewear(parts.eyewear.id, ex0, ex1, ey, bx, bw);
    // Copilot's own pilot's cap and goggles, unless it has a hat on
    if (c.extra === "pilot" && parts.hat.id === "none") {
        roundBox(bx - 1, top - 6, bw + 2, 9, 4, c.ink);
        roundBox(bx, top - 5, bw, 7, 4, "#8a5a2c");
        rect(bx + 4, top - 3, 8, 4, c.ink);
        rect(bx + 16, top - 3, 8, 4, c.ink);
        rect(bx + 5, top - 2, 6, 2, "#9fe8ff");
        rect(bx + 17, top - 2, 6, 2, "#9fe8ff");
    }
    if (parts.hat.id !== "none") drawHat(parts.hat.id, cx, top, dir, bx, bw);
}

// how the player's character stands right now, and which way it faces
function claudePose() {
    const { claude } = g;
    return { ...stance(), dir: claude.dir || 1, moving: claude.left > 0 || !claude.on };
}
function stance() {
    const { claude } = g;
    const look = claude.left > 0 ? claude.dir : 0;
    if (claude.rope) return { legs: 7, armsUp: true, eyes: Math.abs(claude.rope.w) > 0.05 ? "happy" : "open", look: Math.sign(claude.rope.w) };
    if (claude.on) {
        if (claude.left > 0) return { stride: mod(frame >> 3, 2), look };
        return { bob: mod(frame >> 5, 2), eyes: mod(frame, 200) < 8 ? "blink" : "open", look };
    }
    if (claude.vy > 1.2) return { legs: 3, armDy: -4, eyes: "happy", look };
    if (claude.vy > 0) return { legs: 3, armDy: -3, look };
    return { legs: 6, armDy: mod(frame >> 2, 2) ? -2 : 0, eyes: claude.vy < -0.8 ? "wide" : "open", look };
}

// ---- weather behind the world: a darker or dustier sky, far lightning, and the big scenery of a disaster ----

// a pseudo-random spot for particle i of a kind, moving with the weather clock; nothing is stored, so it costs nothing
const spot = (i, salt) => hash(i * 7919 + salt);

function drawWeatherBack(t) {
    const a = sky.amount;
    const tint = { rain: "rgba(20,30,50,", thunderstorm: "rgba(10,14,30,", sandstorm: "rgba(150,100,40,", snow: "rgba(200,210,230,", fog: "rgba(150,160,180," }[sky.weather];
    const depth = { rain: 0.35, thunderstorm: 0.55, sandstorm: 0.4, snow: 0.18, fog: 0.25 }[sky.weather];
    if (tint && a > 0) rect(0, HUD, VW, VH - HUD, `${tint}${(depth * a).toFixed(3)})`);

    // far lightning in a thunderstorm: a fork across the sky for a few ticks
    if (thunderNow(t)) {
        const k = Math.floor(t / THUNDER_EVERY);
        let x = 40 + hash(k * 3) * (VW - 80);
        for (let y = HUD; y < VH - 40; y += 6) {
            const nx = x + (hash(k * 31 + y) - 0.5) * 12;
            rect(Math.min(x, nx), y, Math.abs(nx - x) + 2, 6, "rgba(225,235,255,0.85)");
            if (hash(k * 17 + y) < 0.12) rect(nx, y, 14 * (hash(y) - 0.5), 2, "rgba(225,235,255,0.6)");
            x = nx;
        }
    }

    const p = sky.power;
    if (!sky.disaster || p <= 0) return;
    const d = sky.disaster;
    if (d === "volcano") {
        // a far mountain, its crater glowing and throwing lava up into the sky
        const peakX = VW * 0.72 - mod(camX * CW * 0.1, 40);
        const peakY = VH - 150;
        for (let y = peakY; y < VH; y++) {
            const hw = 10 + (y - peakY) * 1.1;
            rect(peakX - hw, y, hw * 2, 1, y < peakY + 4 ? "#5a1d0a" : "#2a1510");
        }
        rect(peakX - 10, peakY - 2, 20, 4, `rgba(255,${Math.round(120 + 60 * Math.sin(t / 3))},30,${p})`);
        for (let i = 0; i < 26; i++) {
            const life = 34 + spot(i, 1) * 20;
            const ph = mod(t + spot(i, 2) * life, life) / life;
            const vx = (spot(i, 3) - 0.5) * 2.4;
            const vy = 4.5 + spot(i, 4) * 2.5;
            const x = peakX + vx * ph * life;
            const y = peakY - (vy * ph * life - 0.18 * (ph * life) ** 2);
            rect(x, y, 2, 2, ph < 0.5 ? "#ffd84a" : "#ff6a1a");
        }
        rect(0, VH - 60, VW, 60, `rgba(255,90,20,${0.16 * p})`);
    }
    if (d === "tornado") {
        // a twisting funnel crossing far off, wide at the cloud and narrow at the ground
        const cx = mod(t * 0.7 + VW * 0.6 + 80, VW + 160) - 80;
        for (let k = 0; k < 24; k++) {
            const y = VH - 8 - k * 9;
            const w = 6 + k * 2.6;
            const sway = Math.sin(t / 7 + k / 3) * k * 0.7;
            rect(cx + sway - w / 2, y, w, 9, `rgba(70,72,84,${0.8 * p})`);
            rect(cx + sway - w / 2 + mod(t * 2 + k * 5, w), y + 3, 4, 2, `rgba(170,170,185,${0.6 * p})`);
        }
        rect(0, HUD, VW, 24, `rgba(40,40,50,${0.5 * p})`);
        for (let i = 0; i < 14; i++) {
            const ang = t / 5 + i * 1.7;
            const r = 14 + spot(i, 5) * 40;
            const y = VH - 30 - spot(i, 6) * 150;
            rect(cx + Math.cos(ang) * r, y + Math.sin(ang) * 4, 3, 2, "#3b2f24");
        }
    }
    if (d === "meteor shower") {
        // streaks of fire across the sky, and a flash on the horizon where one comes down
        for (let i = 0; i < 9; i++) {
            const life = 46 + spot(i, 8) * 40;
            const ph = mod(t + spot(i, 9) * life, life) / life;
            const sx = spot(i, 10) * VW * 1.2 - 20;
            if (ph < 0.45) {
                const k = ph / 0.45;
                const x = sx + k * 140;
                const y = HUD + 10 + k * (VH - HUD - 60);
                for (let tail = 0; tail < 10; tail++) rect(x - tail * 4, y - tail * 3, 3, 2, `rgba(255,${200 - tail * 14},${120 - tail * 10},${(1 - tail / 10) * p})`);
                rect(x, y, 4, 4, "#fff6c0");
            } else if (ph < 0.55) {
                const r = (ph - 0.45) * 300;
                const x = sx + 140;
                rect(x - r, VH - 50 - r / 3, r * 2, r / 1.5, `rgba(255,220,150,${0.5 * p * (1 - (ph - 0.45) * 10)})`);
            }
        }
    }
}

// ---- disasters down at the city: a flood over it, a fire through it, cracks across it ----

function drawDisasterLow(t) {
    const p = sky.power;
    if (!sky.disaster || p <= 0) return;
    const d = sky.disaster;
    if (d === "flood") {
        // water rising over the city, sloshing in waves
        const level = VH - 14 - 70 * p;
        for (let x = 0; x < VW; x += 2) {
            const wave = Math.sin(x / 14 + t / 5) * 3 + Math.sin(x / 5 + t / 3) * 1.2;
            rect(x, level + wave, 2, VH - level - wave, `rgba(40,96,170,${0.55 * p})`);
            rect(x, level + wave, 2, 1, `rgba(180,220,255,${0.7 * p})`);
        }
        for (let i = 0; i < 6; i++) rect(mod(spot(i, 7) * VW + t * 0.6, VW + 20) - 10, level + Math.sin(t / 5 + i) * 3 - 1, 8, 2, "#5a4630");
    }
    if (d === "wildfire") {
        // a red glow, and flames along the city
        rect(0, VH - 90, VW, 90, `rgba(255,70,20,${0.22 * p})`);
        // smoke billowing up from the fire, drifting off with the wind
        for (let i = 0; i < 7; i++) {
            const baseX = spot(i, 34) * VW;
            for (let k = 0; k < 9; k++) {
                const rise = mod(t * 0.8 + k * 14 + spot(i, 35) * 100, 126);
                const r = 6 + rise / 9;
                rect(baseX + rise * 0.5 - r, VH - 40 - rise - r / 2, r * 2, r, `rgba(45,35,32,${0.4 * p * (1 - rise / 126)})`);
            }
        }
        for (let x = 0; x < VW; x += 4) {
            const h = (14 + Math.abs(Math.sin(x / 9 + t / 2)) * 26 + hash(x + (t >> 1)) * 12) * p;
            rect(x, VH - h, 4, h, x % 8 ? "rgba(255,110,25,0.8)" : "rgba(255,190,50,0.8)");
            rect(x + 1, VH - h * 0.45, 2, h * 0.45, "rgba(255,240,170,0.8)");
        }
    }
    if (d === "earthquake") {
        // cracks spreading across the far ground
        for (let c = 0; c < 4; c++) {
            let x = 30 + c * 90;
            let y = VH - 40;
            const reach = 10 * p;
            for (let s = 0; s < reach; s++) {
                const nx = x + (hash(c * 99 + s) - 0.4) * 14;
                const ny = y + 4;
                rect(Math.min(x, nx), y, Math.abs(nx - x) + 1, 4, "#140c06");
                x = nx;
                y = ny;
            }
        }
    }
}

// ---- weather in front: rain, sand, snow, fog, and what a disaster throws about ----

function drawWeatherFront(t) {
    const a = sky.amount;
    if (sky.weather === "rain" || sky.weather === "thunderstorm") {
        const n = Math.round((sky.weather === "thunderstorm" ? 170 : 100) * a);
        for (let i = 0; i < n; i++) {
            const near = i % 3 === 0;
            const speed = near ? 16 : 10;
            const len = near ? 7 : 4;
            const y = HUD + mod(spot(i, 11) * VH + t * speed, VH - HUD + 20) - 10;
            const x = mod(spot(i, 12) * (VW + 80) - (y - HUD) * 0.35 - camX * CW * (near ? 1 : 0.5), VW + 80) - 40;
            for (let k = 0; k < len; k++) rect(x - k * 0.35, y + k, 1, 1, near ? "rgba(200,215,245,0.75)" : "rgba(160,180,220,0.45)");
        }
        // little splashes on the platforms in view
        for (const p of g.plates) {
            const y = rowTop(p.y);
            if (y < HUD || y > VH) continue;
            for (let s = 0; s < p.len; s += 3) {
                const ph = mod(t + hash(p.n * 13 + s) * 20, 20);
                if (ph > 2 || hash(p.n * 7 + s) > a) continue;
                const x = px(p.x + s + 1);
                rect(x - 2, y - 2 - ph, 1, 1, "rgba(210,225,255,0.8)");
                rect(x + 2, y - 2 - ph, 1, 1, "rgba(210,225,255,0.8)");
                rect(x, y - 1, 1, 1, "rgba(210,225,255,0.8)");
            }
        }
    }
    if (sky.weather === "sandstorm") {
        const n = Math.round(140 * a);
        for (let i = 0; i < n; i++) {
            const speed = 9 + spot(i, 13) * 9;
            const x = mod(spot(i, 14) * (VW + 80) * 2 + t * speed * (sky.wind ?? 1), VW + 80) - 40;
            const y = HUD + spot(i, 15) * (VH - HUD) + Math.sin(t / 5 + i) * 3;
            const long = i % 4 === 0;
            rect(x, y, long ? 9 : 2, 1, long ? "rgba(235,190,120,0.55)" : "rgba(210,160,90,0.8)");
        }
        rect(0, HUD, VW, VH - HUD, `rgba(190,130,60,${0.18 * a})`);
    }
    if (sky.weather === "snow") {
        const n = Math.round(120 * a);
        for (let i = 0; i < n; i++) {
            const depth = i % 3;
            const speed = 0.7 + depth * 0.7;
            const y = HUD + mod(spot(i, 16) * VH + t * speed, VH - HUD);
            const x = mod(spot(i, 17) * VW + Math.sin(t / 18 + i) * (4 + depth * 3) - camX * CW * (0.3 + depth * 0.3), VW);
            const size = depth === 2 ? 2 : 1;
            rect(x, y, size, size, depth === 0 ? "rgba(255,255,255,0.5)" : "rgba(255,255,255,0.9)");
        }
    }
    if (sky.weather === "fog") {
        for (let k = 0; k < 5; k++) {
            const y = HUD + (k + 0.5) * ((VH - HUD) / 5) + Math.sin(t / 60 + k) * 10;
            const drift = t * (0.3 + k * 0.1) - camX * CW * 0.6;
            for (let x = -mod(drift, 60) - 60; x < VW + 60; x += 60) {
                const h = 10 + hash(k * 31 + Math.floor((x + drift) / 60)) * 14;
                for (let s = 0; s < 3; s++) rect(x + s * 6, y - h / 2 + s * 2, 60 - s * 12, h - s * 4, `rgba(220,225,235,${0.07 * a})`);
            }
        }
    }

    const p = sky.power;
    if (!sky.disaster || p <= 0) return;
    const d = sky.disaster;
    if (d === "volcano") {
        // ash drifting down, and embers floating up
        for (let i = 0; i < 70 * p; i++) {
            const y = HUD + mod(spot(i, 18) * VH + t * (0.8 + spot(i, 19)), VH - HUD);
            const x = mod(spot(i, 20) * VW + Math.sin(t / 20 + i) * 6, VW);
            rect(x, y, 2, 1, "rgba(120,110,105,0.75)");
        }
        for (let i = 0; i < 18 * p; i++) {
            const y = VH - mod(spot(i, 21) * VH + t * 1.6, VH - HUD);
            rect(mod(spot(i, 22) * VW + Math.sin(t / 9 + i) * 8, VW), y, 1, 1, mod(t + i, 6) < 3 ? "#ffb347" : "#ff5a1a");
        }
    }
    if (d === "wildfire") {
        rect(0, HUD, VW, VH - HUD, `rgba(70,40,30,${0.22 * p})`);
        for (let i = 0; i < 40 * p; i++) {
            const y = VH - mod(spot(i, 23) * VH + t * (1.2 + spot(i, 24)), VH - HUD);
            rect(mod(spot(i, 25) * VW + Math.sin(t / 7 + i) * 10, VW), y, 2, 1, mod(t + i, 8) < 4 ? "#ffcf4a" : "#ff6a1a");
        }
    }
    if (d === "earthquake") {
        // dust and small stones shaken loose from above
        for (let i = 0; i < 30 * p; i++) {
            const y = HUD + mod(spot(i, 26) * VH + t * (3 + spot(i, 27) * 3), VH - HUD);
            const big = i % 5 === 0;
            rect(mod(spot(i, 28) * VW, VW), y, big ? 3 : 1, big ? 3 : 1, big ? "#6b5a48" : "rgba(170,150,120,0.7)");
        }
    }
    if (d === "tornado") {
        for (let i = 0; i < 10; i++) {
            const x = mod(spot(i, 29) * VW + t * (6 + spot(i, 30) * 6), VW + 20) - 10;
            const y = HUD + spot(i, 31) * (VH - HUD) + Math.sin(t / 3 + i) * 8;
            rect(x, y, 3, 2, "rgba(60,50,40,0.8)");
        }
    }
    if (d === "flood" && sky.amount < 0.3) {
        // a flood comes with rain even when the sky itself is clear
        for (let i = 0; i < 60 * p; i++) {
            const y = HUD + mod(spot(i, 32) * VH + t * 12, VH - HUD + 20) - 10;
            const x = mod(spot(i, 33) * (VW + 80) - (y - HUD) * 0.3, VW + 80) - 40;
            rect(x, y, 1, 4, "rgba(170,190,230,0.55)");
        }
    }
}

function drawArt(rows, colors, x, y, flip) {
    rows.forEach((row, r) => {
        [...row].forEach((ch, c) => {
            if (ch === ".") return;
            const col = flip ? row.length - 1 - c : c;
            rect(x + col * 2, y + r * 2, 2, 2, ch === "k" ? INK : colors[ch]);
        });
    });
}

// a creature where it is: its own art, facing the way it goes, and a dropper's thread up to where it hangs from
function drawCreature(c, at, atY) {
    const x = px(at);
    if (x < -24 || x > VW + 8) return;
    const art = CREATURE_ART[c.kind];
    if (!art) return drawBug({ ...c, y: atY }, at);
    const bottom = rowTop(atY) + CH;
    if (c.style === "drop") rect(x + 12, rowTop(c.top + 2), 1, bottom - 16 - rowTop(c.top + 2), "rgba(220,225,240,0.6)");
    // a swooper diving leaves a streak behind it
    if (c.style === "swoop" && c.phase === "dive") {
        for (let k = 1; k <= 3; k++) rect(x + 12 - c.dir * k * 6, bottom - 10 + k * 2, 4, 2, `rgba(255,255,255,${0.3 - k * 0.08})`);
    }
    const frameNo = mod((frame >> 3) + (c.t >> 2), 2);
    drawArt(art.frames[frameNo], art.colors, x, bottom - 16, c.dir < 0);
}

// ---- meteors, lava bombs and fires ----

// a strike's target: a blinking ring on the platform where it will land, and the thing itself coming down on it
function drawStrike(s) {
    const cx = px(s.x + 1.5);
    const feet = py(s.y);
    const blink = mod(frame >> 3, 2);
    const ring = s.kind === "meteor" ? "#ff4a4a" : "#ff8a1a";
    // a faint column marks the spot from above, so it can be seen coming from anywhere on screen
    rect(cx - 12, HUD, 24, feet - HUD, `rgba(255,80,40,${blink ? 0.1 : 0.05})`);
    rect(cx - 14, feet - 2, 28, 2, blink ? ring : "#ffe0a0");
    rect(cx - 14, feet - 6, 2, 4, ring);
    rect(cx + 12, feet - 6, 2, 4, ring);
    for (let k = 0; k < 3; k++) {
        rect(cx - 5 + k * 2, feet - 12 + k * 2, 2, 2, ring);
        rect(cx + 3 - k * 2, feet - 12 + k * 2, 2, 2, ring);
    }
    const high = s.t * 0.6;
    const fx = px(s.x + 1.5 + s.from * s.t * 0.4);
    const fy = py(s.y + high);
    if (fy < HUD - 20) return;
    if (s.kind === "meteor") {
        for (let tail = 1; tail < 8; tail++) rect(fx + s.from * tail * 5 - 2, fy - 8 - tail * 7, 5 - tail * 0.5, 5 - tail * 0.5, `rgba(255,${200 - tail * 18},80,${1 - tail / 8})`);
        rect(fx - 5, fy - 12, 10, 10, INK);
        rect(fx - 4, fy - 11, 8, 8, "#7a6450");
        rect(fx - 3, fy - 10, 3, 3, "#b39a7d");
        rect(fx + 1, fy - 6, 2, 2, "#4a3a2c");
    } else {
        for (let tail = 1; tail < 6; tail++) rect(fx + s.from * tail * 3 - 1, fy - 6 - tail * 6, 3, 3, `rgba(255,${140 - tail * 16},20,${1 - tail / 6})`);
        rect(fx - 4, fy - 10, 8, 8, INK);
        rect(fx - 3, fy - 9, 6, 6, mod(frame >> 2, 2) ? "#ff6a1a" : "#ffb347");
        rect(fx - 2, fy - 8, 2, 2, "#fff0a0");
    }
}

// where a strike landed: a burst of light and rubble, gone in a moment
function drawImpact(i) {
    const cx = px(i.x + 1.5);
    const feet = py(i.y);
    const k = 12 - i.t;
    const r = 6 + k * 3;
    const glow = i.kind === "meteor" ? "255,230,160" : "255,140,40";
    rect(cx - r, feet - r / 2, r * 2, r / 2, `rgba(${glow},${0.6 - k * 0.05})`);
    for (let n = 0; n < 8; n++) {
        const ang = (n / 8) * Math.PI;
        rect(cx + Math.cos(ang) * r, feet - Math.sin(ang) * r * 0.8, 3, 3, i.kind === "meteor" ? "#8a7360" : "#ff7a1a");
    }
}

// a platform on fire: smoke curling up off it first, then flames all along the part that burns
function drawFire(p, at) {
    const x0 = px(at);
    const y = rowTop(p.y);
    if (y > VH || y < HUD - CH * 3) return;
    const { from, to, smoke } = p.fire;
    for (let i = from; i <= to; i++) {
        const cx = x0 + i * CW + 4;
        if (smoke > 0) {
            // the smoke thickens as it gets closer to catching
            const thick = 1 - smoke / 40;
            const rise = mod(frame / 2 + hash(p.n * 7 + i) * 24, 24);
            if (hash(p.n * 13 + i) < 0.4 + thick * 0.6) rect(cx - 2 + Math.sin(rise / 4) * 2, y - 4 - rise, 4 + rise / 6, 3, `rgba(90,85,85,${(0.25 + thick * 0.4) * (1 - rise / 24)})`);
            if (thick > 0.5 && mod(frame + i * 5, 12) < 3) rect(cx - 1, y - 2, 2, 2, "#ff8a1a");
            continue;
        }
        const h = 8 + Math.abs(Math.sin(frame / 5 + i * 1.3)) * 10 + hash(i + (frame >> 2)) * 4;
        rect(cx - 4, y - h, 8, h, "rgba(255,90,20,0.85)");
        rect(cx - 2, y - h * 0.7, 4, h * 0.7, "#ffb347");
        rect(cx - 1, y - h * 0.35, 2, h * 0.35, "#fff0a0");
    }
    if (smoke === 0) rect(x0 + from * CW, y, (to - from + 1) * CW, CH, "rgba(60,20,10,0.45)");
}

// a boss is drawn on a canvas of its own first, so a hit can flash just its shape white
const bossCanvas = document.createElement("canvas");
bossCanvas.width = 120;
bossCanvas.height = 84;
const BOSS_PAD = 12;
function onBossCanvas(draw) {
    const keep = ctx;
    ctx = bossCanvas.getContext("2d");

    try {

        rect(x + (look > 0 ? size - 3 : 0), y + 2, 3, 3, pupil);

}
